# ===========================================================================
# R2 / Agent Sandbox
#
# - Controller (3018): ORCHESTRATOR=ecs; RunTasks the pre-registered
#   retool-agent-sandbox family and resolves each sandbox at instanceIP:hostPort.
# - Proxy (3019): browser-facing WebSocket egress; fronted by the ALB.
# - Sandbox task definition: the bridge-networked, dynamic-host-port family the
#   controller launches. All env/devices/seccomp are baked in because RunTask
#   sends no overrides.
# - js-executor (3000): serverless functions (nsjail).
# - r2-agent-worker: server-side agent loop (Temporal queue r2-agent).
# ===========================================================================
  RetoolBackendCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: retool-backend
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

  AgentSandboxControllerCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: agent-sandbox-controller
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

  AgentSandboxProxyCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: agent-sandbox-proxy
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

  JsExecutorCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: js-executor
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

  AgentSandboxControllerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-agent-sandbox-controller'
      TaskRoleArn: !Ref 'AgentSandboxControllerTaskRole'
      ExecutionRoleArn: !Ref 'SandboxExecutionRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: 'agent-sandbox-controller'
          Cpu: '512'
          Memory: '1024'
          Essential: true
          Image: !Sub tryretool/agent-sandbox-service:${RetoolVersion}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_AGENT_SANDBOX_CONTROLLER"
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: AGENT_SANDBOX_ROLE
              Value: controller
            - Name: CONTROLLER_PORT
              Value: "3018"
            - Name: ORCHESTRATOR
              Value: ecs
            - Name: ECS_CLUSTER_NAME
              Value: !Ref 'RetoolCluster'
            - Name: ECS_TASK_DEFINITION_FAMILY
              Value: retool-agent-sandbox
            - Name: ECS_CONTAINER_NAME
              Value: agent-executor
            - Name: ECS_TASK_GROUP
              Value: agent-executor-sandbox
            - Name: ECS_REGION
              Value: !Ref 'AWS::Region'
            - Name: STATE_BACKEND
              Value: postgres
            - Name: AGENT_SANDBOX_POSTGRES_URL
              Value: !Sub
                - "postgres://${U}:${P}@${H}:5432/hammerhead_production"
                - U: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:username}}'
                  P: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:password}}'
                  H: !GetAtt [RetoolRDSInstance, Endpoint.Address]
            - Name: AGENT_SANDBOX_POSTGRES_SCHEMA
              Value: agent_executor
            - Name: SANDBOX_BACKEND_URL
              Value: http://retool-backend.retoolsvc:3000
            - Name: DEPLOYED_IMAGE_TAG
              Value: !Ref 'RetoolVersion'
            - Name: PREWARM_POOL_SIZE
              Value: "5"
            - Name: MAX_TOTAL_JOBS
              Value: "50"
            - Name: MAX_CONCURRENT_CREATES
              Value: "3"
            - !If
              - EnableWatcher
              - Name: ECS_TASK_EVENTS_SQS_URL
                Value: !Ref 'SandboxTaskEventsQueue'
              - !Ref 'AWS::NoValue'
          Secrets:
            - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
          PortMappings:
            - ContainerPort: 3018
              Protocol: tcp

  AgentSandboxControllerService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      ServiceRegistries:
        - RegistryArn: !GetAtt [AgentSandboxControllerCloudmapService, Arn]
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'AgentSandboxControllerTask'

  AgentSandboxProxyTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-agent-sandbox-proxy'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      ExecutionRoleArn: !Ref 'SandboxExecutionRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: 'agent-sandbox-proxy'
          Cpu: '512'
          Memory: '1024'
          Essential: true
          Image: !Sub tryretool/agent-sandbox-service:${RetoolVersion}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_AGENT_SANDBOX_PROXY"
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: AGENT_SANDBOX_ROLE
              Value: proxy
            - Name: PROXY_PORT
              Value: "3019"
            - Name: ORCHESTRATOR
              Value: ecs
            - Name: EXECUTOR_PORT
              Value: "3017"
            - Name: STATE_BACKEND
              Value: postgres
            - Name: AGENT_SANDBOX_POSTGRES_URL
              Value: !Sub
                - "postgres://${U}:${P}@${H}:5432/hammerhead_production"
                - U: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:username}}'
                  P: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:password}}'
                  H: !GetAtt [RetoolRDSInstance, Endpoint.Address]
            - Name: AGENT_SANDBOX_POSTGRES_SCHEMA
              Value: agent_executor
            - Name: BACKEND_URL
              Value: http://retool-backend.retoolsvc:3000
            - Name: SANDBOX_PROXY_TIMEOUT_MS
              Value: "180000"
            - !If
              - HasAllowedDomains
              - Name: ALLOWED_DOMAINS
                Value: !Ref 'AllowedDomains'
              - !Ref 'AWS::NoValue'
          Secrets:
            - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
            - Name: AGENT_SANDBOX_ENCRYPTION_KEY
              ValueFrom: !Ref AgentSandboxEncryptionKeySecret
          PortMappings:
            - ContainerPort: 3019
              Protocol: tcp

  AgentSandboxProxyService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      ServiceRegistries:
        - RegistryArn: !GetAtt [AgentSandboxProxyCloudmapService, Arn]
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'AgentSandboxProxyTask'

  # Pre-registered family the controller RunTasks. Bridge networking with a
  # dynamic host port (containerPort 3017 -> ephemeral hostPort) keeps sandboxes
  # off per-task ENIs; the controller reads the binding and reaches the sandbox
  # at instanceIP:hostPort. Pinned to sandbox-attributed hosts.
  AgentSandboxTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-agent-sandbox'
      TaskRoleArn: !Ref 'SandboxTaskRole'
      ExecutionRoleArn: !Ref 'SandboxExecutionRole'
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      PlacementConstraints:
        - Type: memberOf
          Expression: "attribute:retool.sandbox == true"
      # Tag propagated to launched sandbox tasks (controller RunTask must use
      # propagateTags: TASK_DEFINITION) so the controller's ecs:StopTask
      # permission can be scoped to sandbox tasks only via aws:ResourceTag.
      Tags:
        - Key: retool-sandbox
          Value: "true"
      ContainerDefinitions:
        - Name: 'agent-executor'
          Cpu: '2048'
          Memory: '4096'
          Essential: true
          Image: !Sub tryretool/agent-sandbox-service:${RetoolVersion}
          User: "1001:1001"
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities:
              Drop: ["ALL"]
            Devices:
              - HostPath: /dev/net/tun
                ContainerPath: /dev/net/tun
                Permissions: [read, write]
          DockerSecurityOptions:
            - "no-new-privileges"
            - "seccomp=/etc/retool/gvisor-seccomp.json"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_AGENT_SANDBOX"
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: EXECUTOR_PORT
              Value: "3017"
            - Name: SANDBOX_NETWORK_ENABLED
              Value: "true"
            - Name: SANDBOX_HTTP_PROXY
              Value: http://agent-sandbox-proxy.retoolsvc:3019
            - Name: SANDBOX_BACKEND_URL
              Value: http://retool-backend.retoolsvc:3000
            - Name: SANDBOX_IDLE_TIMEOUT_MS
              Value: "600000"
            - Name: S3_BUCKET
              Value: !Ref 'RrSnapshotsBucket'
            - Name: S3_REGION
              Value: !Ref 'AWS::Region'
          Secrets:
            - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
          PortMappings:
            - ContainerPort: 3017
              HostPort: 0
              Protocol: tcp

  JsExecutorTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-js-executor'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      ExecutionRoleArn: !Ref 'SandboxExecutionRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: 'js-executor'
          Cpu: '2048'
          Memory: '4096'
          Essential: true
          Image: !Sub tryretool/js-executor-service:${RetoolVersion}
          LinuxParameters:
            Capabilities:
              Add: ["NET_ADMIN"]
          DockerSecurityOptions:
            - "seccomp=/etc/retool/nsjail-seccomp.json"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_JS_EXECUTOR"
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: NODE_OPTIONS
              Value: "--max_old_space_size=1024"
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp

  JsExecutorService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!GetAtt [RetoolSecurityGroup, GroupId]]
