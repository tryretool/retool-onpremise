          Cpu: '2048'
          Memory: '4096'
          Essential: true
          Image: !Sub tryretool/backend:${RetoolVersion}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_RETOOL"
          Environment:
            - Name: DEPLOYMENT_TEMPLATE_TYPE
              Value: "aws-ecs-ec2"
            - Name: NODE_ENV
              Value: production
            - Name: SERVICE_TYPE
              Value: R2_AGENT_TEMPORAL_WORKER
            - Name: WORKER_TEMPORAL_TASKQUEUE
              Value: r2-agent
            - Name: POSTGRES_DB
              Value: hammerhead_production
            - Name: POSTGRES_HOST
              Value: !GetAtt [RetoolRDSInstance, Endpoint.Address]
            - Name: POSTGRES_SSL_ENABLED
              Value: "true"
            - Name: POSTGRES_PORT
              Value: "5432"
            - Name: POSTGRES_USER
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:username}}' ]]
            - Name: POSTGRES_PASSWORD
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:password}}' ]]
            - Name: JWT_SECRET
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolJWTSecret, ':SecretString:password}}' ]]
            - Name: ENCRYPTION_KEY
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolEncryptionKeySecret, ':SecretString:password}}' ]]
            - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_HOST
              Value: temporal.retoolsvc
            - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_PORT
              Value: "7233"
            - Name: LICENSE_KEY
              Value: !Ref LicenseKey
            - Name: RR_AGENT_PUBSUB_BACKEND
              Value: postgres
            - Name: AGENT_SANDBOX_CONTROLLER_INGRESS_DOMAIN
              Value: http://agent-sandbox-controller.retoolsvc:3018
            - Name: AGENT_SANDBOX_PROXY_INGRESS_DOMAIN
              Value: http://agent-sandbox-proxy.retoolsvc:3019
            - Name: AGENT_SANDBOX_POSTGRES_URL
              Value: !Sub
                - "postgres://${U}:${P}@${H}:5432/hammerhead_production"
                - U: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:username}}'
                  P: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:password}}'
                  H: !GetAtt [RetoolRDSInstance, Endpoint.Address]
            - Name: AGENT_SANDBOX_POSTGRES_SCHEMA
              Value: agent_executor
          Secrets:
            - Name: AGENT_SANDBOX_JWT_PRIVATE_KEY
              ValueFrom: !Ref AgentSandboxJwtPrivateKeySecret
            - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
            - Name: AGENT_SANDBOX_ENCRYPTION_KEY
              ValueFrom: !Ref AgentSandboxEncryptionKeySecret
          Command: ["./docker_scripts/start_api.sh"]

  R2AgentWorkerService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!GetAtt [RetoolSecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'R2AgentWorkerTask'

# ===========================================================================
# R2 supporting resources: IAM, security groups, S3, proxy ingress, watcher
# ===========================================================================

  # Controller calls the ECS/EC2 control plane to launch and resolve sandboxes.
  AgentSandboxControllerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: /
      Policies:
        - PolicyName: agent-sandbox-controller
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:DescribeContainerInstances
                  - ec2:DescribeInstances
                Resource: '*'
              # StopTask is confined to sandbox tasks in this stack's cluster.
              # Task ARNs are dynamic, so the resource is '*' and two conditions
              # provide the boundary: ecs:cluster (this stack only) and
              # aws:ResourceTag/retool-sandbox (sandbox tasks only). Sandbox
              # tasks are tagged via AgentSandboxTaskDefinition; the controller
              # must propagate task-definition tags (propagateTags:
              # TASK_DEFINITION) at RunTask so the tag reaches the running task.
              - Effect: Allow
                Action: [ecs:StopTask]
                Resource: '*'
                Condition:
                  StringEquals:
                    ecs:cluster: !GetAtt [RetoolCluster, Arn]
                    aws:ResourceTag/retool-sandbox: "true"
              # Scoped to the sandbox task family only: the credential-bearing
              # platform task definitions (RetoolTask, R2AgentWorkerTask, ...)
              # store CloudFormation-resolved PostgreSQL credentials in their
              # Environment, so a wildcard DescribeTaskDefinition would let a
              # compromised controller read those plaintext credentials. The
              # controller only needs to inspect the sandbox task definition.
              - Effect: Allow
                Action: [ecs:DescribeTaskDefinition]
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/retool-agent-sandbox:*'
              # RunTask is scoped to the sandbox task family AND this stack's
              # cluster (matching the StopTask boundary) so a compromised
              # controller cannot launch the sandbox task (and its delegated S3
              # snapshot permissions) on an unrelated compatible ECS cluster.
              - Effect: Allow
                Action: [ecs:RunTask]
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/retool-agent-sandbox:*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt [RetoolCluster, Arn]
              - Effect: Allow
                Action: [iam:PassRole]
                Resource:
                  - !GetAtt [SandboxTaskRole, Arn]
                  - !GetAtt [SandboxExecutionRole, Arn]

  # SQS permissions are scoped to the watcher queue and only attached when the
  # watcher is enabled (the queue is conditionally created). See EnableWatcher.
  AgentSandboxControllerSqsPolicy:
    Condition: EnableWatcher
    Type: AWS::IAM::Policy
    Properties:
      Roles:
        - !Ref AgentSandboxControllerTaskRole
      PolicyName: agent-sandbox-controller-sqs
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
            Resource: !GetAtt [SandboxTaskEventsQueue, Arn]

  # Task execution role (image pull + log writes) shared by the R2 task defs.
  SandboxExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: /
      Policies:
        - PolicyName: agent-sandbox-execution
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource:
                  - !Ref AgentSandboxJwtPrivateKeySecret
                  - !Ref AgentSandboxJwtPublicKeySecret
                  - !Ref AgentSandboxEncryptionKeySecret

  # Sandbox task role: snapshot S3 read/write via the default credential chain.
  SandboxTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: /
      Policies:
        - PolicyName: agent-sandbox-snapshots
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !GetAtt [RrSnapshotsBucket, Arn]
                  - !Sub "${RrSnapshotsBucket.Arn}/*"

  # Shared SG for the controller + proxy task ENIs.
  AgentSandboxControllerProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'agent sandbox controller/proxy security group']]
      VpcId: !Ref 'VpcId'

  ControllerIngressFromBackend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3018
      ToPort: 3018
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  ProxyIngressFromBackend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3019
      ToPort: 3019
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  ProxyIngressFromSandboxHosts:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3019
      ToPort: 3019
      SourceSecurityGroupId: !GetAtt [SandboxInstanceSecurityGroup, GroupId]

  # Backend reachable from controller/proxy (token exchange, SANDBOX_BACKEND_URL)
  # and from sandbox containers (egress via the sandbox host SG).
  BackendIngressFromControllerProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RetoolSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]

  BackendIngressFromSandboxHosts:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RetoolSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !GetAtt [SandboxInstanceSecurityGroup, GroupId]

  # Controller (health-poll) and proxy (request forwarding) reach sandbox
  # containers on the bridge dynamic host-port range.
  SandboxHostIngressFromControllerProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [SandboxInstanceSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 60999
      SourceSecurityGroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]

  RrSnapshotsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  RrGitBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # EventBridge -> SQS task-state watcher (optional; controller polls otherwise).
  SandboxTaskEventsQueue:
    Type: AWS::SQS::Queue
    Condition: EnableWatcher
    Properties:
      MessageRetentionPeriod: 3600
      VisibilityTimeout: 60

  SandboxTaskEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: EnableWatcher
    Properties:
      Queues: [!Ref 'SandboxTaskEventsQueue']
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt [SandboxTaskEventsQueue, Arn]
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt [SandboxTaskStateRule, Arn]

  SandboxTaskStateRule:
    Type: AWS::Events::Rule
    Condition: EnableWatcher
    Properties:
      Description: ECS task-state changes for the agent sandbox group.
      EventPattern:
        source: ["aws.ecs"]
        detail-type: ["ECS Task State Change"]
        detail:
          clusterArn: [!GetAtt [RetoolCluster, Arn]]
          group: ["agent-executor-sandbox"]
      Targets:
        - Arn: !GetAtt [SandboxTaskEventsQueue, Arn]
          Id: sandbox-task-events

Outputs:
  ECSALB:
    Description: Your ALB DNS URL. The agent sandbox proxy is served same-origin under /sandbox/* through the backend, so no separate endpoint is exposed.
    Value: !GetAtt [ECSALB, DNSName]
