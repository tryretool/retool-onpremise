AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Retool + Workflows + R2 (agent sandbox) on ECS-on-EC2. Self-contained: defines
  its own ECS cluster, two EC2 capacity pools (awsvpc platform services + a
  gVisor-ready bridge-networked sandbox pool), the agent-sandbox controller/proxy,
  the pre-registered sandbox task definition the controller RunTasks, the
  js-executor and r2-agent Temporal worker, S3 snapshot/git buckets, and an
  optional EventBridge->SQS task-state watcher.
Parameters:
  Environment:
    Type: String
    Description: Environment string sent back to plogger with the logs
  SubnetId:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Select at two private subnets in your selected VPC (for ECS tasks and EC2 capacity).
  ALBSubnetId:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Select the subnets for your Application Load Balancer.
  RetoolVersion:
    Type: String
    Description: Retool version tag (e.g. 3.114.7-stable). Used for backend, code-executor, js-executor, and agent-sandbox-service images.
    Default: 3.114.7-stable
  DesiredCount:
    Type: Number
    Description: Default number of API container tasks to run
    Default: 1
  DesiredWorkflowsCount:
    Type: Number
    Description: Default number of tasks to run for Workflows Backend and Workflows Worker containers to run
    Default: 1
  DesiredCodeExecutorCount:
    Type: Number
    Description: Default number of tasks to run for Retool Code Executor containers
    Default: 1
  EnableNsjail:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      Run the code executor in privileged mode so it can use nsjail sandboxing,
      which is required for custom JS/Python libraries. Defaults to false
      (hardened: non-privileged, dropped capabilities, non-root user) to avoid
      host-level blast radius. Set to true only if you need custom libraries.
      See https://docs.retool.com/self-hosted/concepts/architecture#code-executor
  MaximumPercent:
    Type: Number
    Description: Maximum percentage of tasks to run during a deployment
    Default: 150
  MinimumHealthyPercent:
    Type: Number
    Default: 50
    Description: Minimum percentage of healthy tasks to keep running during a deployment
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Select a VPC that allows instances access to the Internet.
  LicenseKey:
    Type: String
    NoEcho: true
    Description: Retool license key. Without a valid key the backend will refuse to start.
    Default: "EXPIRED-LICENSE-KEY-TRIAL"
  CertificateArn:
    Type: String
    Description: >-
      Optional ACM certificate ARN. When provided, the ALB serves HTTPS on 443
      and redirects HTTP to HTTPS, and COOKIE_INSECURE is forced off. Leave blank
      for plaintext HTTP (e.g. when terminating TLS on an upstream load balancer).
    Default: ""
  AlbScheme:
    Type: String
    AllowedValues: ["internal", "internet-facing"]
    Default: "internal"
    Description: >-
      ALB scheme. Defaults to internal so the stack is not reachable from the
      internet unless an operator explicitly opts in. For a public deployment,
      set to internet-facing and supply a CertificateArn so authenticated
      traffic is served over HTTPS rather than plaintext HTTP.
  Force:
    Type: String
    Description: "Used to force the deployment even when the image and parameters are otherwised unchanged."
    Default: "false"

  # --- EC2 capacity ---------------------------------------------------------
  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: ECS-optimized AMI. Default resolves the latest Amazon Linux 2023 ECS AMI (no AppArmor, so the gVisor sandbox needs only tun + a seccomp profile on the host).
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id
  KeyName:
    Type: String
    Description: Optional EC2 key pair name for SSH access to capacity instances. Leave blank to disable SSH.
    Default: ""
  PlatformInstanceType:
    Type: String
    Description: Instance type for the platform capacity pool (awsvpc Retool/Workflows/Temporal services). Size for ENI count, not just CPU/RAM.
    Default: m5.xlarge
  PlatformAsgMinSize:
    Type: Number
    Default: 2
  PlatformAsgMaxSize:
    Type: Number
    Default: 6
  PlatformAsgDesiredCapacity:
    Type: Number
    Default: 3
  SandboxInstanceType:
    Type: String
    Description: Instance type for the gVisor sandbox capacity pool. Sandboxes are 2 vCPU / 4 GB each and bridge-networked, so they binpack to the CPU/RAM limit.
    Default: m5.2xlarge
  SandboxAsgMinSize:
    Type: Number
    Default: 1
  SandboxAsgMaxSize:
    Type: Number
    Default: 10
  SandboxAsgDesiredCapacity:
    Type: Number
    Description: Provision enough instances to hold the prewarm pool plus headroom (each m5.2xlarge holds ~4 sandboxes).
    Default: 2
  SandboxInstanceVolumeSize:
    Type: Number
    Description: Root EBS volume (GiB) for sandbox hosts. Sandbox /tmp is large (build artifacts), so give headroom.
    Default: 100

  # --- Agent sandbox (R2) secrets -------------------------------------------
  # CloudFormation cannot mint an EC P-256 keypair, so the JWT keys are passed in.
  # Generate with:
  #   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out ae.key
  #   openssl ec -in ae.key -pubout -out ae.pub
  AgentSandboxJwtPublicKey:
    Type: String
    NoEcho: true
    Description: ES256 (P-256) public key PEM for sandbox token verification. Newlines may be literal or \n-escaped.
  AgentSandboxJwtPrivateKey:
    Type: String
    NoEcho: true
    Description: ES256 (P-256) private key PEM the backend uses to mint sandbox tokens.
  AgentSandboxEncryptionKey:
    Type: String
    NoEcho: true
    Description: Hex-encoded 256-bit key (openssl rand -hex 32) for encrypting credentials in the agent sandbox state store. Must match the backend.
  AllowedDomains:
    Type: String
    Description: Optional comma-separated allowlist of external domains sandboxes may reach via the proxy (e.g. api.openai.com,api.anthropic.com). Empty allows all non-blocked egress.
    Default: ""

  # --- Watcher --------------------------------------------------------------
  EnableTaskEventWatcher:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Create an EventBridge->SQS pipeline for ECS task-state changes so the controller reconciles faster. When false, the controller falls back to its 5s reconcile poll.

Rules:
  RequireTlsForPublicAlb:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref AlbScheme, "internet-facing"]]
          - !Not [!Equals [!Ref CertificateArn, ""]]
        AssertDescription: >-
          AlbScheme=internet-facing exposes the stack to the internet and must
          be paired with a CertificateArn so authenticated traffic is served over
          HTTPS. Use an internal ALB (the default) or supply an ACM certificate.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  HasAllowedDomains: !Not [!Equals [!Ref AllowedDomains, ""]]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  EnableWatcher: !Equals [!Ref EnableTaskEventWatcher, "true"]
  UseNsjail: !Equals [!Ref EnableNsjail, "true"]

Resources:
  # ===========================================================================
  # ECS cluster + EC2 capacity
  #
  # Two capacity pools share the cluster:
  #   - Platform: awsvpc services (Retool, Workflows, Temporal, code/js-executor,
  #     agent-sandbox controller/proxy, r2-agent-worker). Each task gets an ENI,
  #     so instances are sized for ENI count.
  #   - Sandbox: gVisor-ready hosts for the bridge-networked, RunTask'd ephemeral
  #     sandboxes. UserData loads /dev/net/tun and writes the gVisor seccomp
  #     profile the sandbox task definition references. Tagged with the
  #     `retool.sandbox` ECS attribute so only sandbox tasks land here.
  # Capacity-provider binding keeps platform services off sandbox hosts; the
  # sandbox task definition's memberOf placement constraint keeps sandboxes on
  # sandbox hosts.
  # ===========================================================================
  RetoolCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref 'AWS::StackName'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: [ec2.amazonaws.com]
            Action: ['sts:AssumeRole']
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles: [!Ref EcsInstanceRole]

  PlatformInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'platform capacity instance security group']]
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (ECR/ECS/logs/RDS)

  SandboxInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'sandbox capacity instance security group']]
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (S3 snapshots, sandbox egress via proxy, backend callbacks)

  PlatformLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Join ['-', [!Ref 'AWS::StackName', 'platform']]
      LaunchTemplateData:
        ImageId: !Ref 'EcsAmiId'
        InstanceType: !Ref 'PlatformInstanceType'
        KeyName: !If [HasKeyName, !Ref 'KeyName', !Ref 'AWS::NoValue']
        IamInstanceProfile:
          Arn: !GetAtt [EcsInstanceProfile, Arn]
        SecurityGroupIds:
          - !GetAtt [PlatformInstanceSecurityGroup, GroupId]
        # js-executor uses nsjail (NET_ADMIN + a host seccomp profile), so the
        # profile must exist on platform hosts where js-executor runs.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            echo "ECS_CLUSTER=${RetoolCluster}" >> /etc/ecs/ecs.config
            mkdir -p /etc/retool
            echo "" | base64 -d | gunzip > /etc/retool/nsjail-seccomp.json
            chmod 0644 /etc/retool/nsjail-seccomp.json

  SandboxLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Join ['-', [!Ref 'AWS::StackName', 'sandbox']]
      LaunchTemplateData:
        ImageId: !Ref 'EcsAmiId'
        InstanceType: !Ref 'SandboxInstanceType'
        KeyName: !If [HasKeyName, !Ref 'KeyName', !Ref 'AWS::NoValue']
        IamInstanceProfile:
          Arn: !GetAtt [EcsInstanceProfile, Arn]
        SecurityGroupIds:
          - !GetAtt [SandboxInstanceSecurityGroup, GroupId]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref 'SandboxInstanceVolumeSize'
              VolumeType: gp3
              DeleteOnTermination: true
        # gVisor (runsc --rootless) + pasta run inside the sandbox container and
        # need /dev/net/tun on the host plus a seccomp profile that allows their
        # mount/pivot_root syscalls. The sandbox task definition references
        # /etc/retool/gvisor-seccomp.json via dockerSecurityOptions.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            echo "ECS_CLUSTER=${RetoolCluster}" >> /etc/ecs/ecs.config
            echo 'ECS_INSTANCE_ATTRIBUTES={"retool.sandbox":"true"}' >> /etc/ecs/ecs.config
            modprobe tun
            echo tun > /etc/modules-load.d/retool-tun.conf
            mkdir -p /etc/retool
            echo "" | base64 -d | gunzip > /etc/retool/gvisor-seccomp.json
            chmod 0644 /etc/retool/gvisor-seccomp.json

  PlatformAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref 'SubnetId'
      LaunchTemplate:
        LaunchTemplateId: !Ref 'PlatformLaunchTemplate'
        Version: !GetAtt [PlatformLaunchTemplate, LatestVersionNumber]
      MinSize: !Ref 'PlatformAsgMinSize'
      MaxSize: !Ref 'PlatformAsgMaxSize'
      DesiredCapacity: !Ref 'PlatformAsgDesiredCapacity'
      NewInstancesProtectedFromScaleIn: true
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref 'AWS::StackName', 'platform']]
          PropagateAtLaunch: true

  SandboxAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref 'SubnetId'
      LaunchTemplate:
        LaunchTemplateId: !Ref 'SandboxLaunchTemplate'
        Version: !GetAtt [SandboxLaunchTemplate, LatestVersionNumber]
      MinSize: !Ref 'SandboxAsgMinSize'
      MaxSize: !Ref 'SandboxAsgMaxSize'
      DesiredCapacity: !Ref 'SandboxAsgDesiredCapacity'
      NewInstancesProtectedFromScaleIn: true
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref 'AWS::StackName', 'sandbox']]
          PropagateAtLaunch: true

  PlatformCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref 'PlatformAutoScalingGroup'
        ManagedTerminationProtection: ENABLED
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100

  # Managed scaling reacts to tasks placed via this capacity provider's strategy.
  # The controller currently RunTasks with launchType EC2, so for v1 size the
  # sandbox ASG statically (DesiredCapacity for the prewarm pool + headroom).
  SandboxCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref 'SandboxAutoScalingGroup'
        ManagedTerminationProtection: ENABLED
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 90

  ClusterCapacityProviderAssociations:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref 'RetoolCluster'
      CapacityProviders:
        - !Ref 'PlatformCapacityProvider'
        - !Ref 'SandboxCapacityProvider'
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref 'PlatformCapacityProvider'
          Weight: 1
          Base: 0

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'load balancer security group']]
      VpcId: !Ref 'VpcId'

  GlobalHttpInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [ALBSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '80'
      ToPort: '80'
      CidrIp: '0.0.0.0/0'

  GlobalHttpsInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [ALBSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '443'
      ToPort: '443'
      CidrIp: '0.0.0.0/0'
  
  RetoolSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'retool container security group']]
      VpcId: !Ref 'VpcId'

  ALBInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RetoolSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '3000'
      ToPort: '3000'
      SourceSecurityGroupId: !GetAtt [ALBSecurityGroup, GroupId]

  RetoolSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RetoolSecurityGroup, GroupId]
      IpProtocol: -1
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  TemporalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'temporal security group']]
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      VpcId: !Ref 'VpcId'

  TemporalFrontendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [TemporalSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 7233
      ToPort: 7233
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  TemporalSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [TemporalSecurityGroup, GroupId]
      IpProtocol: -1
      SourceSecurityGroupId: !GetAtt [TemporalSecurityGroup, GroupId]


  CloudwatchLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['-', [ECSLogGroup, !Ref 'AWS::StackName']]
      RetentionInDays: 14

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'database security group']]
      VpcId: !Ref 'VpcId'

  # Dedicated security group for the Temporal Aurora cluster. Kept separate from
  # RDSSecurityGroup (the Retool main database) so ingress rules on one database
  # do not implicitly open the other. Temporal containers must only be able to
  # reach the Temporal database, not the Retool production database.
  TemporalRDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'temporal database security group']]
      VpcId: !Ref 'VpcId'

  RetoolECSPostgresInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RDSSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '5432'
      ToPort: '5432'
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  # The agent-sandbox controller and proxy are PostgreSQL-backed and run under
  # their own security group, so they need their own ingress to the database.
  AgentSandboxPostgresInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RDSSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '5432'
      ToPort: '5432'
      SourceSecurityGroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]

  # The Temporal services (frontend, history, matching, worker, web) run under
  # their own security group and connect to the Temporal Aurora cluster, which
  # uses TemporalRDSSecurityGroup (separate from the Retool database). This
  # grants Temporal containers access only to the Temporal database.
  TemporalPostgresInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [TemporalRDSSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '5432'
      ToPort: '5432'
      SourceSecurityGroupId: !GetAtt [TemporalSecurityGroup, GroupId]

  RetoolTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      ExecutionRoleArn: !Ref 'RetoolExecutionRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
      - Name: 'retool'
        Cpu: '2048'
        Memory: '4096'
        Essential: 'true'
        Image: !Sub tryretool/backend:${RetoolVersion}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref 'CloudwatchLogsGroup'
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: "SERVICE_RETOOL"
        Environment:
          - Name: DEPLOYMENT_TEMPLATE_TYPE
            Value: "aws-ecs-ec2"
          - Name: NODE_ENV
            Value: production
          - Name: SERVICE_TYPE
            Value: MAIN_BACKEND,DB_CONNECTOR,DB_SSH_CONNECTOR
          - Name: "FORCE_DEPLOYMENT"
            Value: !Ref "Force"
          - Name: POSTGRES_DB
            Value: hammerhead_production
          - Name: POSTGRES_HOST
            Value: !GetAtt [RetoolRDSInstance, Endpoint.Address]
          - Name: POSTGRES_SSL_ENABLED
            Value: "true"
          - Name: POSTGRES_PORT
            Value: "5432"
          - Name: POSTGRES_USER
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:username}}' ]]
          - Name: POSTGRES_PASSWORD
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:password}}' ]]
          - Name: JWT_SECRET
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolJWTSecret, ':SecretString:password}}' ]]
          - Name: ENCRYPTION_KEY
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolEncryptionKeySecret, ':SecretString:password}}' ]]
          - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_HOST
            Value: temporal.retoolsvc
          - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_PORT
            Value: "7233"
          - Name: WORKFLOW_BACKEND_HOST
            Value: http://workflows-backend.retoolsvc:3000
          - Name: CODE_EXECUTOR_INGRESS_DOMAIN
            Value: http://code-executor.retoolsvc:3004
          - Name: JS_EXECUTOR_INGRESS_DOMAIN
            Value: http://js-executor.retoolsvc:3000
          - Name: LICENSE_KEY
            Value: !Ref LicenseKey
          # Set automatically from CertificateArn: insecure cookies are only
          # served when no TLS certificate is attached to the ALB.
          - Name: COOKIE_INSECURE
            Value: !If [HasCertificate, "false", "true"]
          # --- R2 / agent sandbox integration ---
          - Name: AGENT_SANDBOX_ENABLED
            Value: "true"
          - Name: RR_AGENT_PUBSUB_BACKEND
            Value: postgres
          - Name: AGENT_SANDBOX_CONTROLLER_INGRESS_DOMAIN
            Value: http://agent-sandbox-controller.retoolsvc:3018
          # Browser sandbox traffic is served same-origin: the frontend hits the
          # main ingress and the backend forwards /sandbox/* to the proxy below.
          # AGENT_SANDBOX_FRONTEND_WS_PROXY_DOMAIN is intentionally unset so the
          # backend falls back to the org's base URL.
          - Name: AGENT_SANDBOX_PROXY_INGRESS_DOMAIN
            Value: http://agent-sandbox-proxy.retoolsvc:3019
          - Name: AGENT_SANDBOX_POSTGRES_URL
            Value: !Sub
              - "postgres://${U}:${P}@${H}:5432/hammerhead_production"
              - U: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:username}}'
                P: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:password}}'
                H: !GetAtt [RetoolRDSInstance, Endpoint.Address]
          - Name: AGENT_SANDBOX_POSTGRES_SCHEMA
            Value: agent_executor
          # --- R2 blob storage (snapshots + RR git) ---
          - Name: RR_SNAPSHOTS_S3_BUCKET
            Value: !Ref 'RrSnapshotsBucket'
          - Name: RR_SNAPSHOTS_S3_REGION
            Value: !Ref 'AWS::Region'
          - Name: RR_GIT_S3_BUCKET
            Value: !Ref 'RrGitBucket'
          - Name: RR_GIT_S3_REGION
            Value: !Ref 'AWS::Region'
        Secrets:
          - Name: AGENT_SANDBOX_JWT_PRIVATE_KEY
            ValueFrom: !Ref AgentSandboxJwtPrivateKeySecret
          - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
            ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
          - Name: AGENT_SANDBOX_ENCRYPTION_KEY
            ValueFrom: !Ref AgentSandboxEncryptionKeySecret
        PortMappings:
        - ContainerPort: '3000'
          # HostPort: '80'
        Command: ["./docker_scripts/start_api.sh"]

  RetoolJobsRunnerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-jobs-runner'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
      - Name: 'retool-jobs-runner'
        Cpu: '1024'
        Memory: '2048'
        Essential: 'true'
        Image: !Sub tryretool/backend:${RetoolVersion}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref 'CloudwatchLogsGroup'
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: "SERVICE_RETOOL"
        Environment:
          - Name: DEPLOYMENT_TEMPLATE_TYPE
            Value: "aws-ecs-ec2"
          - Name: NODE_ENV
            Value: production
          - Name: SERVICE_TYPE
            Value: JOBS_RUNNER
          - Name: "FORCE_DEPLOYMENT"
            Value: !Ref "Force"
          - Name: POSTGRES_DB
            Value: hammerhead_production
          - Name: POSTGRES_HOST
            Value: !GetAtt [RetoolRDSInstance, Endpoint.Address]
          - Name: POSTGRES_SSL_ENABLED
            Value: "true"
          - Name: POSTGRES_PORT
            Value: "5432"
          - Name: POSTGRES_USER
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:username}}' ]]
          - Name: POSTGRES_PASSWORD
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:password}}' ]]
          - Name: JWT_SECRET
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolJWTSecret, ':SecretString:password}}' ]]
          - Name: ENCRYPTION_KEY
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolEncryptionKeySecret, ':SecretString:password}}' ]]
          - Name: LICENSE_KEY
            Value: !Ref LicenseKey
        Command: ["./docker_scripts/start_api.sh"]

  RetoolWorkflowsBackendTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-workflows-backend'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
      - Name: 'retool-workflows-backend'
        Cpu: '2048'
        Memory: '4096'
        Essential: 'true'
        Image: !Sub tryretool/backend:${RetoolVersion}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref 'CloudwatchLogsGroup'
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: "SERVICE_RETOOL"
        Environment:
          - Name: DEPLOYMENT_TEMPLATE_TYPE
            Value: "aws-ecs-ec2"
          - Name: NODE_ENV
            Value: production
          - Name: SERVICE_TYPE
            Value: WORKFLOW_BACKEND,DB_CONNECTOR,DB_SSH_CONNECTOR
          - Name: "FORCE_DEPLOYMENT"
            Value: !Ref "Force"
          - Name: POSTGRES_DB
            Value: hammerhead_production
          - Name: POSTGRES_HOST
            Value: !GetAtt [RetoolRDSInstance, Endpoint.Address]
          - Name: POSTGRES_SSL_ENABLED
            Value: "true"
          - Name: POSTGRES_PORT
            Value: "5432"
          - Name: POSTGRES_USER
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:username}}' ]]
          - Name: POSTGRES_PASSWORD
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:password}}' ]]
          - Name: JWT_SECRET
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolJWTSecret, ':SecretString:password}}' ]]
          - Name: ENCRYPTION_KEY
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolEncryptionKeySecret, ':SecretString:password}}' ]]
          - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_HOST
            Value: temporal.retoolsvc
          - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_PORT
            Value: "7233"
          - Name: WORKFLOW_BACKEND_HOST
            Value: http://workflows-backend.retoolsvc:3000
          - Name: CODE_EXECUTOR_INGRESS_DOMAIN
            Value: http://code-executor.retoolsvc:3004
          - Name: LICENSE_KEY
            Value: !Ref LicenseKey
          # Set automatically from CertificateArn: insecure cookies are only
          # served when no TLS certificate is attached to the ALB.
          - Name: COOKIE_INSECURE
            Value: !If [HasCertificate, "false", "true"]
        PortMappings:
        - ContainerPort: '3000'
        Command: ["./docker_scripts/start_api.sh"]

  RetoolWorkflowsWorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-workflows-worker'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
      - Name: 'retool-workflows-worker'
        Cpu: '2048'
        Memory: '4096'
        Essential: 'true'
        Image: !Sub tryretool/backend:${RetoolVersion}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref 'CloudwatchLogsGroup'
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: "SERVICE_RETOOL"
        Environment:
          - Name: DEPLOYMENT_TEMPLATE_TYPE
            Value: "aws-ecs-ec2"
          - Name: NODE_ENV
            Value: production
          - Name: SERVICE_TYPE
            Value: WORKFLOW_TEMPORAL_WORKER
          - Name: "FORCE_DEPLOYMENT"
            Value: !Ref "Force"
          - Name: POSTGRES_DB
            Value: hammerhead_production
          - Name: POSTGRES_HOST
            Value: !GetAtt [RetoolRDSInstance, Endpoint.Address]
          - Name: POSTGRES_SSL_ENABLED
            Value: "true"
          - Name: POSTGRES_PORT
            Value: "5432"
          - Name: POSTGRES_USER
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:username}}' ]]
          - Name: POSTGRES_PASSWORD
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:password}}' ]]
          - Name: JWT_SECRET
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolJWTSecret, ':SecretString:password}}' ]]
          - Name: ENCRYPTION_KEY
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolEncryptionKeySecret, ':SecretString:password}}' ]]
          - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_HOST
            Value: temporal.retoolsvc
          - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_PORT
            Value: "7233"
          - Name: WORKFLOW_BACKEND_HOST
            Value: http://workflows-backend.retoolsvc:3000
          - Name: CODE_EXECUTOR_INGRESS_DOMAIN
            Value: http://code-executor.retoolsvc:3004
          - Name: LICENSE_KEY
            Value: !Ref LicenseKey
        Command: ["./docker_scripts/start_api.sh"]

  RetoolCodeExecutorTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-code-executor'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: "retool-code-executor"
          Cpu: '2048'
          Memory: '4096'
          Essential: true
          Image: !Sub tryretool/code-executor-service:${RetoolVersion}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudwatchLogsGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: SERVICE_RETOOL
          # nsjail sandboxing (required for custom JS/Python libraries) needs
          # privileged mode. By default (EnableNsjail=false) the executor runs
          # hardened: non-privileged, all capabilities dropped, non-root user, and
          # no-new-privileges, so an executor escape cannot compromise the host.
          # Set EnableNsjail=true to opt back into privileged nsjail mode.
          # Learn more here: https://docs.retool.com/self-hosted/concepts/architecture#code-executor
          Privileged: !If [UseNsjail, true, false]
          User: !If [UseNsjail, !Ref 'AWS::NoValue', "1001:1001"]
          LinuxParameters: !If
            - UseNsjail
            - !Ref 'AWS::NoValue'
            - InitProcessEnabled: true
              Capabilities:
                Drop: ["ALL"]
          DockerSecurityOptions:
            - "no-new-privileges"
          Environment:
            - Name: NODE_OPTIONS
              Value: "--max_old_space_size=1024"
            - Name: NODE_ENV
              Value: "production"
          PortMappings:
            - ContainerPort: 3004
              HostPort: 3004
              Protocol: "tcp"
          Command:
            - ./start.sh

  RetoolJWTSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'This is the secret for Retool JWTs'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: 'password'
        PasswordLength: 16
        ExcludeCharacters: '"@/\'

  RetoolEncryptionKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'This is the secret for encrypting credentials'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: 'password'
        PasswordLength: 16
        ExcludeCharacters: '"@/\'

  RetoolRDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'This is the secret for the Retool RDS instance'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "retool"}'
        GenerateStringKey: 'password'
        PasswordLength: 16
        # Also excludes URL-reserved characters so the password is safe to embed
        # in AGENT_SANDBOX_POSTGRES_URL without percent-encoding.
        ExcludeCharacters: '"@/\:?#[]% '

  # Agent sandbox secrets. The JWT keys / encryption key are user-supplied via
  # CloudFormation parameters (they must match across backend + sandbox tasks),
  # so they cannot be auto-generated. Store the parameter values in Secrets
  # Manager and inject them via the ECS `Secrets` property so they are fetched
  # at runtime instead of being stored as plaintext in the task definition.
  AgentSandboxJwtPrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'Agent sandbox ES256 private key (user-supplied)'
      SecretString: !Ref AgentSandboxJwtPrivateKey

  AgentSandboxJwtPublicKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'Agent sandbox ES256 public key (user-supplied)'
      SecretString: !Ref AgentSandboxJwtPublicKey

  AgentSandboxEncryptionKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'Agent sandbox encryption key (user-supplied)'
      SecretString: !Ref AgentSandboxEncryptionKey


  RetoolRDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AllocatedStorage: "80"
      DBInstanceClass: "db.m5.large"
      Engine: postgres
      EngineVersion: "15.10"
      DBName: "hammerhead_production"
      StorageEncrypted: true
      MasterUsername: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:username}}' ]]
      MasterUserPassword: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:password}}' ]]
      Port: "5432"
      VPCSecurityGroups: [!GetAtt [RDSSecurityGroup, GroupId]]
      DBSubnetGroupName: !Ref 'RDSSubnetGroup'

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties: 
      DBSubnetGroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'rds subnet security group']]
      SubnetIds: !Ref 'SubnetId' 

  ECSALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Join ['-', [!Ref 'AWS::StackName', 'lb']]
      Scheme: !Ref AlbScheme
      LoadBalancerAttributes:
      - Key: idle_timeout.timeout_seconds
        Value: '60'
      Subnets: !Ref 'ALBSubnetId'
      SecurityGroups: [!GetAtt [ALBSecurityGroup, GroupId]]

  # HTTP listener. When no certificate is provided it forwards to the backend;
  # when a certificate is provided it redirects to the HTTPS listener on 443.
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn: RetoolServiceRole
    Properties:
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref 'ECSTG'
      LoadBalancerArn: !Ref 'ECSALB'
      Port: '80'
      Protocol: HTTP

  # HTTPS listener, only created when an ACM certificate is supplied.
  ALBHttpsListener:
    Condition: HasCertificate
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn: RetoolServiceRole
    Properties:
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
      - Type: forward
        TargetGroupArn: !Ref 'ECSTG'
      LoadBalancerArn: !Ref 'ECSALB'
      Port: '443'
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

  ECSALBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DependsOn: ALBListener
    Properties:
      Actions:
      - Type: forward
        TargetGroupArn: !Ref 'ECSTG'
      Conditions:
      - Field: path-pattern
        Values: [/]
      ListenerArn: !If [HasCertificate, !Ref 'ALBHttpsListener', !Ref 'ALBListener']
      Priority: 1

  ECSTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: ECSALB
    Properties:
      TargetType: ip
      HealthCheckIntervalSeconds: 61
      HealthCheckPath: '/api/checkHealth'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 60
      HealthyThresholdCount: 4
      Name: !Join ['-', [!Ref 'AWS::StackName', 'tg']]
      Port: '3000'
      Protocol: HTTP
      UnhealthyThresholdCount: 2
      VpcId: !Ref 'VpcId'
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '30'

  RetoolECSservice:
    Type: AWS::ECS::Service
    DependsOn: [ALBListener, ClusterCapacityProviderAssociations]
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED # must be run in private subnet with NAT gateway
          SecurityGroups: [!GetAtt [RetoolSecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      # Registered in CloudMap so internal components (controller, proxy,
      # sandboxes, r2-agent-worker) reach the backend at retool-backend.retoolsvc
      # without hairpinning through the internet-facing ALB.
      ServiceRegistries:
        - RegistryArn: !GetAtt [RetoolBackendCloudmapService, Arn]
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: !Ref 'DesiredCount'
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      LoadBalancers:
      - ContainerName: 'retool'
        ContainerPort: '3000'
        TargetGroupArn: !Ref 'ECSTG'
      TaskDefinition: !Ref 'RetoolTask'

  RetoolJobsRunnerECSservice:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED # must be run in private subnet with NAT gateway
          SecurityGroups: [!GetAtt [RetoolSecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: 1
      TaskDefinition: !Ref 'RetoolJobsRunnerTask'

  RetoolWorkflowsWorkerECSService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED # must be run in private subnet with NAT gateway
          SecurityGroups: [!GetAtt [RetoolSecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: !Ref 'DesiredWorkflowsCount'
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'RetoolWorkflowsWorkerTask'

  RetoolWorkflowsBackendECSService:
    DependsOn: [RetoolWorkflowBackendServiceCloudmapService, ClusterCapacityProviderAssociations]
    Type: AWS::ECS::Service
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED # must be run in private subnet with NAT gateway
          SecurityGroups: [!GetAtt [RetoolSecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      ServiceRegistries:
        - RegistryArn: !GetAtt [RetoolWorkflowBackendServiceCloudmapService, Arn]
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: !Ref 'DesiredWorkflowsCount'
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'RetoolWorkflowsBackendTask'

  RetoolCodeExecutorECSService:
    DependsOn: [RetoolCodeExecutorServiceCloudmapService, ClusterCapacityProviderAssociations]
    Type: AWS::ECS::Service
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED # must be run in private subnet with NAT gateway
          SecurityGroups: [!GetAtt [RetoolSecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      ServiceRegistries:
        - RegistryArn: !GetAtt [RetoolCodeExecutorServiceCloudmapService, Arn]
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: !Ref 'DesiredCodeExecutorCount'
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'RetoolCodeExecutorTask'

  RetoolServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [ecs.amazonaws.com]
          Action: ['sts:AssumeRole']
      Path: /
      Policies:
      - PolicyName: !Join ['-', ['Retool', !Ref 'Environment', 'service-policy']]
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action: [
              'elasticloadbalancing:DeregisterInstancesFromLoadBalancer',
              'elasticloadbalancing:DeregisterTargets',
              'elasticloadbalancing:Describe*',
              'elasticloadbalancing:RegisterInstancesWithLoadBalancer',
              'elasticloadbalancing:RegisterTargets',
              'ec2:Describe*',
              'ec2:AuthorizeSecurityGroupIngress']
            Resource: '*'

  RetoolTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: ['ecs-tasks.amazonaws.com']
          Action: ['sts:AssumeRole']
      Path: /
      Policies:
        - PolicyName: !Join ['-', ['Retool', !Ref 'Environment', 'rr-blob-storage']]
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !GetAtt [RrSnapshotsBucket, Arn]
                  - !Sub "${RrSnapshotsBucket.Arn}/*"
                  - !GetAtt [RrGitBucket, Arn]
                  - !Sub "${RrGitBucket.Arn}/*"

  # Execution role for platform tasks (Retool backend + R2 agent worker) that
  # inject agent-sandbox secrets via the ECS `Secrets` property. Grants ECR image
  # pull, CloudWatch Logs writes, and Secrets Manager read for the sandbox keys.
  RetoolExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: agent-sandbox-secrets
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource:
                  - !Ref AgentSandboxJwtPrivateKeySecret
                  - !Ref AgentSandboxJwtPublicKeySecret
                  - !Ref AgentSandboxEncryptionKeySecret

# Workflows
  WorkflowsCloudMapNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: retoolsvc
      Vpc: !Ref 'VpcId'

  RetoolWorkflowBackendServiceCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: workflows-backend
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

  RetoolCodeExecutorServiceCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: code-executor
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

# Temporal
  RetoolTemporalRDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'This is the secret for the Retool Temporal RDS instance'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "retool"}'
        GenerateStringKey: 'password'
        PasswordLength: 16
        ExcludeCharacters: '"@/\'

  # RDS-based Temporal DB
  # RetoolTemporalRDSInstance:
  #   Type: AWS::RDS::DBInstance
  #   Properties:
  #     AllocatedStorage: "80"
  #     DBInstanceClass: "db.m4.large"
  #     Engine: postgres
  #     EngineVersion: "11.12"
  #     DBName: "temporal"
  #     MasterUsername: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolTemporalRDSSecret, ':SecretString:username}}' ]]
  #     MasterUserPassword: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolTemporalRDSSecret, ':SecretString:password}}' ]]
  #     Port: "5432"
  #     VPCSecurityGroups: [!GetAtt [RDSSecurityGroup, GroupId]]
  #     DBSubnetGroupName: !Ref 'RDSSubnetGroup'

  # Aurora-based Temporal DB
  RetoolTemporalRDSCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Engine: "aurora-postgresql"
      EngineVersion: "16.6"
      StorageEncrypted: true
      MasterUsername: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolTemporalRDSSecret, ':SecretString:username}}' ]]
      MasterUserPassword: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolTemporalRDSSecret, ':SecretString:password}}' ]]
      Port: "5432"
      VpcSecurityGroupIds: [!GetAtt [TemporalRDSSecurityGroup, GroupId]]
      DBSubnetGroupName: !Ref 'RDSSubnetGroup'
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 10
  RetoolTemporalRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: "aurora-postgresql"
      DBInstanceClass: "db.serverless"
      DBClusterIdentifier: !Ref 'RetoolTemporalRDSCluster'

  TemporalClusterFrontendTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-temporal-frontend'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: temporal-cluster-frontend
          Cpu: '256'
          Memory: '512'
          Essential: 'true'
          Image: tryretool/one-offs:retool-temporal-1.1.6
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_RETOOL_TEMPORAL"
          Environment:
            - Name: SERVICES
              Value: frontend
            - Name: LOG_LEVEL
              Value: debug,info
            - Name: NUM_HISTORY_SHARDS
              Value: "128"
            - Name: DB
              Value: postgresql
            - Name: POSTGRES_HOST
              Value: !GetAtt [RetoolTemporalRDSInstance, Endpoint.Address]
            - Name: POSTGRES_PORT
              Value: 5432
            - Name: POSTGRES_USER
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolTemporalRDSSecret, ':SecretString:username}}' ]]
            - Name: POSTGRES_PASSWORD
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolTemporalRDSSecret, ':SecretString:password}}' ]]
            # - Name: SQL_TLS_ENABLED
            #   Value: "true"
            # - Name: SQL_TLS
            #   Value: "true"
            # - Name: SQL_TLS_SKIP_HOST_VERIFICATION
            #   Value: "true"
            # - Name: SQL_TLS_DISABLE_HOST_VERIFICATION
            #   Value: "true"
            - Name: DBNAME
              Value: temporal
            - Name: DBNAME_VISIBILITY
              Value: temporal_visibility
            - Name: DYNAMIC_CONFIG_FILE_PATH
              Value: /etc/temporal/ecs/dynamic_config/dynamicconfig-sql.yaml
            - Name: ECS_DEPLOYED
              Value: "true"
          PortMappings:
            - ContainerPort: 7233
              HostPort: 7233
              Protocol: tcp
            - ContainerPort: 6933
              HostPort: 6933
              Protocol: tcp
  TemporalClusterHistoryTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-temporal-history'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: temporal-cluster-history
          Cpu: '512'
          Memory: '1024'
          Essential: 'true'
          Image: tryretool/one-offs:retool-temporal-1.1.6
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_RETOOL_TEMPORAL"
          Environment:
            - Name: SERVICES
              Value: history
            - Name: LOG_LEVEL
              Value: debug,info
            - Name: NUM_HISTORY_SHARDS
              Value: "128"
            - Name: DB
              Value: postgresql
            - Name: POSTGRES_HOST
              Value: !GetAtt [RetoolTemporalRDSInstance, Endpoint.Address]
            - Name: POSTGRES_PORT
              Value: 5432
            - Name: POSTGRES_USER
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolTemporalRDSSecret, ':SecretString:username}}' ]]
            - Name: POSTGRES_PASSWORD
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolTemporalRDSSecret, ':SecretString:password}}' ]]
            # - Name: SQL_TLS_ENABLED
            #   Value: "true"
            # - Name: SQL_TLS
            #   Value: "true"
            # - Name: SQL_TLS_SKIP_HOST_VERIFICATION
            #   Value: "true"
            # - Name: SQL_TLS_DISABLE_HOST_VERIFICATION
            #   Value: "true"
            - Name: DBNAME
              Value: temporal
            - Name: DBNAME_VISIBILITY
              Value: temporal_visibility
            - Name: DYNAMIC_CONFIG_FILE_PATH
              Value: /etc/temporal/ecs/dynamic_config/dynamicconfig-sql.yaml
            - Name: PUBLIC_FRONTEND_ADDRESS
              Value: temporal.retoolsvc:7233
            - Name: ECS_DEPLOYED
              Value: "true"
          PortMappings:
            - ContainerPort: 7234
              HostPort: 7234
              Protocol: tcp
            - ContainerPort: 6934
              HostPort: 6934
              Protocol: tcp
  TemporalClusterMatchingTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-temporal-matching'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: temporal-cluster-matching
          Cpu: '512'
          Memory: '1024'
          Essential: 'true'
          Image: tryretool/one-offs:retool-temporal-1.1.6
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
