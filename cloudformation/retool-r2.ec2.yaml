        - RegistryArn: !GetAtt [JsExecutorCloudmapService, Arn]
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: !Ref 'DesiredCodeExecutorCount'
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'JsExecutorTask'

  R2AgentWorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-r2-agent-worker'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      ExecutionRoleArn: !Ref 'RetoolExecutionRole'
