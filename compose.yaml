# Comment out the below 'include' block to use Retool-managed Temporal (Enterprise license)
include:
  - temporal.yaml

services:
  api:
    build:
      context: .
    env_file: docker.env
    environment:
      - SERVICE_TYPE=MAIN_BACKEND,DB_CONNECTOR,DB_SSH_CONNECTOR,RR_GIT_SERVER
    ports:
      - 3000:3000
    networks:
      - frontend
      - backend
      - code-executor
      - js-executor
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: always

  jobs-runner:
    build:
      context: .
    env_file: docker.env
    environment:
      - SERVICE_TYPE=JOBS_RUNNER
    networks:
      - backend
    depends_on:
      - postgres
    restart: always

  workflows-backend:
    build:
      context: .
    env_file: docker.env
    environment:
      - SERVICE_TYPE=WORKFLOW_BACKEND,DB_CONNECTOR,DB_SSH_CONNECTOR
    networks:
      - backend
      - code-executor
      - js-executor
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: always

  workflows-worker:
    build:
      context: .
    env_file: docker.env
    environment:
      - SERVICE_TYPE=WORKFLOW_TEMPORAL_WORKER
      - NODE_OPTIONS=--max_old_space_size=1024
    networks:
      - backend
      - code-executor
      - js-executor
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: always

  agent-worker:
    build:
      context: .
    env_file: docker.env
    environment:
      - SERVICE_TYPE=WORKFLOW_TEMPORAL_WORKER
      - WORKER_TEMPORAL_TASKQUEUE=agent
    networks:
      - backend
      - code-executor
      - js-executor
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: always

  agent-eval-worker:
    build:
      context: .
    env_file: docker.env
    environment:
      - SERVICE_TYPE=AGENT_EVAL_TEMPORAL_WORKER
      - WORKER_TEMPORAL_TASKQUEUE=agent-eval
    networks:
      - backend
      - code-executor
      - js-executor
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: always

  # This process owns RetoolOS chat, Jobs, messaging, and search. The application registers
  # their task queues itself; setting WORKER_TEMPORAL_TASKQUEUE would restrict it to one queue.
  retoolos-temporal-worker:
    build:
      context: .
    env_file: docker.env
    environment:
      - SERVICE_TYPE=RETOOLOS_TEMPORAL_WORKER
    networks:
      - backend
      - js-executor
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: always

  code-executor:
    build:
      context: .
      target: code-executor
    
    # Option 1 (preferred): Run privileged to sandbox user code in Workflows
    privileged: true

    # Option 2: Run unprivileged, potentially required with your host machine permissions
    # user: retool_user
    # environment:
    #   - ALLOW_UNSAFE_CODE_EXECUTION=true

    networks:
      - code-executor
    restart: always

  js-executor:
    build:
      context: .
      target: js-executor

    # js-executor reads its memory budget from the cgroup limit, so this must
    # be set explicitly.
    mem_limit: 2g

    # Custom seccomp profile is required for nsjail's syscalls to pass Docker's
    # default seccomp filter. Applies under both options below.
    security_opt:
      - seccomp=./nsjail-seccomp.json

    # Option 1 (preferred): Grant NET_ADMIN so the executor can install
    # iptables egress rules. Requires the host kernel to expose the
    # netfilter `filter` table.
    cap_add:
      - NET_ADMIN

    # Option 2: Skip iptables-based egress filtering. Use this if NET_ADMIN
    # isn't available or the host kernel lacks netfilter support. nsjail still
    # wraps user code; only the network-egress filter is skipped. Note: do
    # not also drop to a non-root user here — the entrypoint uses `runuser`
    # internally to drop privileges and that requires starting as root.
    # environment:
    #   - DISABLE_IPTABLES_SECURITY_CONFIGURATION=true

    networks:
      - js-executor
    restart: always
  
  agent-sandbox-controller:
    build:
      context: .
      target: agent-sandbox
    user: root
    env_file: docker.env
    environment:
      - NODE_ENV=production
      - AGENT_EXECUTOR_ROLE=controller
      - ORCHESTRATOR=docker
      - DOCKER_NETWORK=agent-sandbox
      - EXECUTOR_SERVICE_NAME=agent-sandbox
      - SANDBOX_BACKEND_URL=http://api:3000
      - EXECUTOR_EXTRA_ENV=SANDBOX_NETWORK_ENABLED=false,SANDBOX_HTTP_PROXY=http://agent-sandbox-proxy:3019
      - EXECUTOR_SECCOMP_PROFILE_PATH=/seccomp/gvisor-seccomp.json
      - PREWARM_POOL_SIZE=1
      - MAX_TOTAL_JOBS=10
      - MAX_CONCURRENT_CREATES=2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gvisor-seccomp.json:/seccomp/gvisor-seccomp.json:ro
    networks:
      - backend
      - agent-sandbox
    depends_on:
      - postgres
    restart: always
  
  agent-sandbox-proxy:
    build:
      context: .
      target: agent-sandbox
    env_file: docker.env
    environment:
      - NODE_ENV=production
      - AGENT_EXECUTOR_ROLE=proxy
      - ORCHESTRATOR=docker
      - PROXY_PORT=3019
      - EXECUTOR_SERVICE_NAME=agent-sandbox
      - BACKEND_URL=http://api:3000
      # Uncomment to restrict which external domains sandboxes can reach
      # - ALLOWED_DOMAINS=api.openai.com,api.anthropic.com
    networks:
      - backend
      - agent-sandbox
    depends_on:
      - postgres
    restart: always
  
  r2-agent-worker:
    build:
      context: .
    env_file: docker.env
    environment:
      - SERVICE_TYPE=R2_AGENT_TEMPORAL_WORKER
      - WORKER_TEMPORAL_TASKQUEUE=r2-agent
    networks:
      - backend
      - code-executor
      - js-executor
      - agent-sandbox
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: always

  # Retool MCP server. Lets external MCP clients drive Retool over the Model
  # Context Protocol. Reached at /mcp via the https-portal reverse proxy (see the
  # CUSTOM_NGINX_SERVER_CONFIG_BLOCK below); its OAuth metadata and introspection
  # endpoints are served by the api service. Needs OAUTH_MAIN_DOMAIN and
  # OAUTH_INTROSPECTION_AUTH_TOKEN in docker.env, which install.sh sets up.
  mcp:
    build:
      context: .
    env_file: docker.env
    environment:
      - SERVICE_TYPE=MCP_SERVER
      - MCP_PORT=4010
      - RETOOL_BACKEND_URL=http://api:3000
    networks:
      # frontend so the https-portal reverse proxy can reach it at mcp:4010.
      - frontend
      - backend
      - agent-sandbox
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: docker.env
    environment:
      - MINIO_DOMAIN=minio
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    networks:
      backend:
        aliases:
          - retool-blob-storage.minio
      agent-sandbox:
        aliases:
          - retool-blob-storage.minio
    volumes:
      - minio-data:/data
    restart: always

  minio-init:
    image: minio/mc:latest
    env_file: docker.env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done;
      mc mb --ignore-existing local/retool-blob-storage;
      echo 'Bucket created successfully';
      "
    networks:
      - backend

  # Retool's internal DB, we recommend using an externally hosted database: https://docs.retool.com/docs/configuring-retools-storage-database
  postgres:
    image: postgres:16.8
    env_file: docker.env
    command: -c 'max_connections=200'
    networks:
      - backend
    volumes:
      - data:/var/lib/postgresql/data
    restart: always
  
  retooldb-postgres:
    image: postgres:16.8
    env_file: retooldb.env
    networks:
      - backend
    volumes:
      - retooldb-data:/var/lib/postgresql/data
    restart: always

  # Optional Nginx container for handling TLS for your domain (requires setting DOMAINS and STAGE)
  https-portal:
    image: steveltn/https-portal:1.25.5
    env_file: docker.env
    environment:
      # Change 'local' -> 'production' below once your domain is pointing to this server
      STAGE: local
      # Forwards WebSocket upgrades (proxy_http_version 1.1 + Upgrade/Connection headers).
      # Required for the agent-sandbox preview and multiplayer WebSockets — without it
      # those connections fail with close code 1006 even though normal HTTP works.
      WEBSOCKET: 'true'
      CLIENT_MAX_BODY_SIZE: 40M
      KEEPALIVE_TIMEOUT: 605
      PROXY_CONNECT_TIMEOUT: 600
      PROXY_SEND_TIMEOUT: 600
      PROXY_READ_TIMEOUT: 600
      # MCP routing. The api service listens on two ports: the frontend static
      # server on 3000 (the default "/" upstream) and the backend API on 3001.
      # The frontend server only proxies a fixed set of prefixes to the backend
      # and serves index.html for everything else, so MCP paths must be routed
      # explicitly here or they come back as HTML. Longest-prefix match wins, so
      # these override the "/" proxy. $$ escapes Compose interpolation so nginx
      # receives literal $variables. Remove this block (and the mcp service) to
      # disable MCP.
      CUSTOM_NGINX_SERVER_CONFIG_BLOCK: |
        location /mcp {
          proxy_pass http://mcp:4010;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_buffering off;
          proxy_read_timeout 600s;
        }
        location /.well-known/oauth-protected-resource {
          proxy_pass http://mcp:4010;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-Proto $$scheme;
        }
        # Straight to the backend API port (3001), bypassing the frontend
        # server's SPA fallback, which would otherwise return index.html.
        location = /.well-known/oauth-authorization-server {
          proxy_pass http://api:3001;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-Proto $$scheme;
        }
    ports:
      - 80:80
      - 443:443
    networks:
      - frontend
    restart: always

networks:
  frontend:
  backend:
  code-executor:
  js-executor:
  agent-sandbox:
    name: agent-sandbox

volumes:
  data:
  retooldb-data:
  minio-data:
