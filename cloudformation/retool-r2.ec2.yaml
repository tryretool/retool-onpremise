      Name: temporal
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

# ===========================================================================
# R2 / Agent Sandbox
#
# - Controller (3018): ORCHESTRATOR=ecs; RunTasks the pre-registered
#   retool-agent-sandbox family and resolves each sandbox at instanceIP:hostPort.
# - Proxy (3019): browser-facing WebSocket egress; fronted by the ALB.
# - Sandbox task definition: the bridge-networked, dynamic-host-port family the
#   controller launches. All env/devices/seccomp are baked in because RunTask
#   sends no overrides.
# - js-executor (3000): serverless functions (nsjail).
# - r2-agent-worker: server-side agent loop (Temporal queue r2-agent).
# ===========================================================================
  RetoolBackendCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: retool-backend
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

  AgentSandboxControllerCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: agent-sandbox-controller
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

  AgentSandboxProxyCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: agent-sandbox-proxy
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

  JsExecutorCloudmapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: js-executor
      NamespaceId: !GetAtt [WorkflowsCloudMapNamespace, Id]

  AgentSandboxControllerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-agent-sandbox-controller'
      TaskRoleArn: !Ref 'AgentSandboxControllerTaskRole'
      ExecutionRoleArn: !Ref 'SandboxExecutionRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: 'agent-sandbox-controller'
          Cpu: '512'
          Memory: '1024'
          Essential: true
          Image: !Sub '${AgentSandboxImageRepository}:${RetoolVersion}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_AGENT_SANDBOX_CONTROLLER"
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: AGENT_SANDBOX_ROLE
              Value: controller
            - Name: CONTROLLER_PORT
              Value: "3018"
            - Name: ORCHESTRATOR
              Value: ecs
            - Name: ECS_CLUSTER_NAME
              Value: !Ref 'RetoolCluster'
            - Name: ECS_TASK_DEFINITION_FAMILY
              Value: retool-agent-sandbox
            - Name: ECS_CONTAINER_NAME
              Value: agent-executor
            - Name: ECS_TASK_GROUP
              Value: agent-executor-sandbox
            - Name: ECS_REGION
              Value: !Ref 'AWS::Region'
            - Name: STATE_BACKEND
              Value: postgres
            - Name: AGENT_SANDBOX_POSTGRES_URL
              Value: !Sub
                - "postgres://${U}:${P}@${H}:5432/hammerhead_production?sslmode=no-verify"
                - U: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:username}}'
                  P: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:password}}'
                  H: !GetAtt [RetoolRDSInstance, Endpoint.Address]
            - Name: AGENT_SANDBOX_POSTGRES_SCHEMA
              Value: agent_executor
            - Name: SANDBOX_BACKEND_URL
              Value: !Sub 'http://retool-backend.${CloudMapNamespaceName}:3000'
            - Name: DEPLOYED_IMAGE_TAG
              Value: !Ref 'RetoolVersion'
            - Name: PREWARM_POOL_SIZE
              Value: "5"
            - Name: MAX_TOTAL_JOBS
              Value: "50"
            - Name: MAX_CONCURRENT_CREATES
              Value: "3"
            - !If
              - EnableWatcher
              - Name: ECS_TASK_EVENTS_SQS_URL
                Value: !Ref 'SandboxTaskEventsQueue'
              - !Ref 'AWS::NoValue'
          Secrets:
            - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
          PortMappings:
            - ContainerPort: 3018
              Protocol: tcp

  AgentSandboxControllerService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      ServiceRegistries:
        - RegistryArn: !GetAtt [AgentSandboxControllerCloudmapService, Arn]
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'AgentSandboxControllerTask'

  AgentSandboxProxyTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-agent-sandbox-proxy'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      ExecutionRoleArn: !Ref 'SandboxExecutionRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: 'agent-sandbox-proxy'
          Cpu: '512'
          Memory: '1024'
          Essential: true
          Image: !Sub '${AgentSandboxImageRepository}:${RetoolVersion}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_AGENT_SANDBOX_PROXY"
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: AGENT_SANDBOX_ROLE
              Value: proxy
            - Name: PROXY_PORT
              Value: "3019"
            - Name: ORCHESTRATOR
              Value: ecs
            - Name: EXECUTOR_PORT
              Value: "3017"
            - Name: STATE_BACKEND
              Value: postgres
            - Name: AGENT_SANDBOX_POSTGRES_URL
              Value: !Sub
                - "postgres://${U}:${P}@${H}:5432/hammerhead_production?sslmode=no-verify"
                - U: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:username}}'
                  P: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:password}}'
                  H: !GetAtt [RetoolRDSInstance, Endpoint.Address]
            - Name: AGENT_SANDBOX_POSTGRES_SCHEMA
              Value: agent_executor
            - Name: BACKEND_URL
              Value: !Sub 'http://retool-backend.${CloudMapNamespaceName}:3000'
            - Name: SANDBOX_PROXY_TIMEOUT_MS
              Value: "180000"
            - !If
              - HasAllowedDomains
              - Name: ALLOWED_DOMAINS
                Value: !Ref 'AllowedDomains'
              - !Ref 'AWS::NoValue'
          Secrets:
            - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
            - Name: AGENT_SANDBOX_ENCRYPTION_KEY
              ValueFrom: !Ref AgentSandboxEncryptionKeySecret
          PortMappings:
            - ContainerPort: 3019
              Protocol: tcp

  AgentSandboxProxyService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      ServiceRegistries:
        - RegistryArn: !GetAtt [AgentSandboxProxyCloudmapService, Arn]
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'AgentSandboxProxyTask'

  # Pre-registered family the controller RunTasks. Bridge networking with a
  # dynamic host port (containerPort 3017 -> ephemeral hostPort) keeps sandboxes
  # off per-task ENIs; the controller reads the binding and reaches the sandbox
  # at instanceIP:hostPort. Pinned to sandbox-attributed hosts.
  AgentSandboxTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-agent-sandbox'
      TaskRoleArn: !Ref 'SandboxTaskRole'
      ExecutionRoleArn: !Ref 'SandboxExecutionRole'
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      PlacementConstraints:
        - Type: memberOf
          Expression: "attribute:retool.sandbox == true"
      # Tag propagated to launched sandbox tasks (controller RunTask must use
      # propagateTags: TASK_DEFINITION) so the controller's ecs:StopTask
      # permission can be scoped to sandbox tasks only via aws:ResourceTag.
      Tags:
        - Key: retool-sandbox
          Value: "true"
      ContainerDefinitions:
        - Name: 'agent-executor'
          Cpu: '2048'
          Memory: '4096'
          Essential: true
          Image: !Sub '${AgentSandboxImageRepository}:${RetoolVersion}'
          # Fully hardened despite running rootless gVisor: ECS task definitions
          # cannot set custom seccomp profiles (DockerSecurityOptions rejects
          # them), so the gVisor seccomp profile is installed as the Docker
          # daemon default on the sandbox hosts (see SandboxLaunchTemplate) and
          # inherited here. That profile allows the mount/pivot_root/unshare
          # syscalls rootless gVisor + pasta need, while this container stays
          # non-root, capability-less, no-new-privs, and device-cgroup'd to
          # /dev/net/tun. Custom seccomp cannot be named per-task on ECS; the
          # only alternatives (Privileged or CAP_SYS_ADMIN) are strictly weaker.
          User: "1001:1001"
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities:
              Drop: ["ALL"]
            Devices:
              - HostPath: /dev/net/tun
                ContainerPath: /dev/net/tun
                Permissions: [read, write]
          DockerSecurityOptions:
            - "no-new-privileges"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_AGENT_SANDBOX"
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: EXECUTOR_PORT
              Value: "3017"
            - Name: SANDBOX_NETWORK_ENABLED
              Value: "true"
            - Name: SANDBOX_HTTP_PROXY
              Value: !Sub 'http://agent-sandbox-proxy.${CloudMapNamespaceName}:3019'
            - Name: SANDBOX_BACKEND_URL
              Value: !Sub 'http://retool-backend.${CloudMapNamespaceName}:3000'
            - Name: SANDBOX_IDLE_TIMEOUT_MS
              Value: "600000"
            - Name: S3_BUCKET
              Value: !Ref 'RrSnapshotsBucket'
            - Name: S3_REGION
              Value: !Ref 'AWS::Region'
          Secrets:
            - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
          PortMappings:
            - ContainerPort: 3017
              HostPort: 0
              Protocol: tcp

  JsExecutorTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-js-executor'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      ExecutionRoleArn: !Ref 'SandboxExecutionRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: 'js-executor'
          Cpu: '2048'
          Memory: '4096'
          Essential: true
          Image: !Sub '${JsExecutorImageRepository}:${RetoolVersion}'
          # nsjail needs mount/pivot_root, which Docker's stock default seccomp
          # profile blocks. ECS task definitions cannot set custom seccomp
          # profiles, so this task is pinned to the sandbox host pool (placement
          # constraint + SandboxCapacityProvider below), whose Docker daemon
          # default is the relaxed profile installed by SandboxLaunchTemplate —
          # the same profile the agent sandbox needs. nsjail itself still
          # confines each function execution. NET_ADMIN is required for its
          # per-jail network namespacing.
          LinuxParameters:
            Capabilities:
              Add: ["NET_ADMIN"]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_JS_EXECUTOR"
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: NODE_OPTIONS
              Value: "--max_old_space_size=1024"
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp

  JsExecutorService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!GetAtt [RetoolSecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      # Pinned to the sandbox host pool: js-executor's nsjail needs the relaxed
      # seccomp default those hosts carry (see JsExecutorTask). The cluster's
      # default capacity-provider strategy (platform) is overridden here.
      PlacementConstraints:
        - Type: memberOf
          Expression: "attribute:retool.sandbox == true"
      CapacityProviderStrategy:
        - CapacityProvider: !Ref 'SandboxCapacityProvider'
          Weight: 1
      ServiceRegistries:
        - RegistryArn: !GetAtt [JsExecutorCloudmapService, Arn]
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: !Ref 'DesiredCodeExecutorCount'
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'JsExecutorTask'

  R2AgentWorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-r2-agent-worker'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      ExecutionRoleArn: !Ref 'RetoolExecutionRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Name: 'r2-agent-worker'
          Cpu: '2048'
          Memory: '6144'
          Essential: true
          Image: !Sub '${BackendImageRepository}:${RetoolVersion}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref 'CloudwatchLogsGroup'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: "SERVICE_RETOOL"
          Environment:
            - Name: DEPLOYMENT_TEMPLATE_TYPE
              Value: "aws-ecs-ec2"
            - Name: NODE_ENV
              Value: production
            - Name: SERVICE_TYPE
              Value: R2_AGENT_TEMPORAL_WORKER
            - Name: WORKER_TEMPORAL_TASKQUEUE
              Value: r2-agent
            - Name: POSTGRES_DB
              Value: hammerhead_production
            - Name: POSTGRES_HOST
              Value: !GetAtt [RetoolRDSInstance, Endpoint.Address]
            - Name: POSTGRES_SSL_ENABLED
              Value: "true"
            - Name: POSTGRES_PORT
              Value: "5432"
            - Name: POSTGRES_USER
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:username}}' ]]
            - Name: POSTGRES_PASSWORD
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:password}}' ]]
            - Name: JWT_SECRET
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolJWTSecret, ':SecretString:password}}' ]]
            - Name: ENCRYPTION_KEY
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolEncryptionKeySecret, ':SecretString:password}}' ]]
            # In-cluster Temporal wiring only exists when TemporalBackend=self-hosted;
            # unset means Retool-managed Temporal Cloud (or pg-boss for R2).
            - Fn::If:
                - TemporalSelfHosted
                - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_HOST
                  Value: !Sub 'temporal.${CloudMapNamespaceName}'
                - !Ref 'AWS::NoValue'
            - Fn::If:
                - TemporalSelfHosted
                - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_PORT
                  Value: "7233"
                - !Ref 'AWS::NoValue'
            # pg-boss orchestration for R2 when no Temporal backend is deployed.
            - Fn::If:
                - TemporalDisabled
                - Name: R2_ORCHESTRATION_BACKEND
                  Value: postgres
                - !Ref 'AWS::NoValue'
            - Name: BASE_DOMAIN
              Value: !If [HasBaseDomain, !Ref BaseDomain, !If [HasCertificate, !Sub 'https://${ECSALB.DNSName}', !Sub 'http://${ECSALB.DNSName}']]
            - Name: LICENSE_KEY
              Value: !Ref LicenseKey
            - Name: RR_AGENT_PUBSUB_BACKEND
              Value: postgres
            - Name: AGENT_SANDBOX_CONTROLLER_INGRESS_DOMAIN
              Value: !Sub 'http://agent-sandbox-controller.${CloudMapNamespaceName}:3018'
            - Name: AGENT_SANDBOX_PROXY_INGRESS_DOMAIN
              Value: !Sub 'http://agent-sandbox-proxy.${CloudMapNamespaceName}:3019'
            - Name: AGENT_SANDBOX_POSTGRES_URL
              Value: !Sub
                - "postgres://${U}:${P}@${H}:5432/hammerhead_production?sslmode=no-verify"
                - U: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:username}}'
                  P: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:password}}'
                  H: !GetAtt [RetoolRDSInstance, Endpoint.Address]
            - Name: AGENT_SANDBOX_POSTGRES_SCHEMA
              Value: agent_executor
            # --- R2 blob storage (snapshots + RR git), mirroring RetoolTask ---
            # The r2-agent worker runs the sandbox provisioning activities
            # (provisionAgentExecutorSandbox, snapshot restore, publish).
            # Without these the blob-store factory falls back to RR_DEFAULT_S3_*
            # and throws 'Required environment variable RR_DEFAULT_S3_BUCKET
            # is not set' at provisioning time.
            - Name: RR_SNAPSHOTS_S3_BUCKET
              Value: !Ref 'RrSnapshotsBucket'
            - Name: RR_SNAPSHOTS_S3_REGION
              Value: !Ref 'AWS::Region'
            - Name: RR_GIT_S3_BUCKET
              Value: !Ref 'RrGitBucket'
            - Name: RR_GIT_S3_REGION
              Value: !Ref 'AWS::Region'
          Secrets:
            - Name: AGENT_SANDBOX_JWT_PRIVATE_KEY
              ValueFrom: !Ref AgentSandboxJwtPrivateKeySecret
            - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
              ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
            - Name: AGENT_SANDBOX_ENCRYPTION_KEY
              ValueFrom: !Ref AgentSandboxEncryptionKeySecret
          Command: ["./docker_scripts/start_api.sh"]

  R2AgentWorkerService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviderAssociations
    Properties:
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!GetAtt [RetoolSecurityGroup, GroupId]]
          Subnets: !Ref 'SubnetId'
      Cluster: !Ref 'RetoolCluster'
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: !Ref 'MaximumPercent'
        MinimumHealthyPercent: !Ref 'MinimumHealthyPercent'
      TaskDefinition: !Ref 'R2AgentWorkerTask'

# ===========================================================================
# R2 supporting resources: IAM, security groups, S3, proxy ingress, watcher
# ===========================================================================

  # Controller calls the ECS/EC2 control plane to launch and resolve sandboxes.
  AgentSandboxControllerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: /
      Policies:
        - PolicyName: agent-sandbox-controller
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:DescribeContainerInstances
                  - ec2:DescribeInstances
                Resource: '*'
              # StopTask is confined to sandbox tasks in this stack's cluster.
              # Task ARNs are dynamic, so the resource is '*' and two conditions
              # provide the boundary: ecs:cluster (this stack only) and
              # aws:ResourceTag/retool-sandbox (sandbox tasks only). Sandbox
              # tasks are tagged via AgentSandboxTaskDefinition; the controller
              # must propagate task-definition tags (propagateTags:
              # TASK_DEFINITION) at RunTask so the tag reaches the running task.
              - Effect: Allow
                Action: [ecs:StopTask]
                Resource: '*'
                Condition:
                  StringEquals:
                    ecs:cluster: !GetAtt [RetoolCluster, Arn]
                    aws:ResourceTag/retool-sandbox: "true"
              # DescribeTaskDefinition has no resource-level support in IAM:
              # the request resource is always '*', so scoping this to the
              # sandbox family silently denies the controller's lookup of the
              # active revision. It then falls back to DEPLOYED_IMAGE_TAG (a
              # Docker tag such as pr-4.58.0-...) and RunTask pins
              # 'retool-agent-sandbox:<tag>' as a revision, which ECS rejects
              # with 'Invalid revision number' and no prewarm sandbox starts.
              # The wildcard below is therefore unavoidable. Note the residual
              # exposure: a compromised controller can describe any task
              # definition in the account, and the credential-bearing platform
              # task definitions (RetoolTask, R2AgentWorkerTask, ...) carry
              # CloudFormation-resolved PostgreSQL credentials in their
              # Environment. Moving those credentials behind Secrets Manager
              # references would close that gap.
              - Effect: Allow
                Action: [ecs:DescribeTaskDefinition]
                Resource: '*'
              # propagateTags: TASK_DEFINITION (used by createSandbox) requires
              # ecs:TagResource; the tags land on freshly created tasks, so the
              # resource is '*' and the boundary is this stack's cluster.
              - Effect: Allow
                Action: [ecs:TagResource]
                Resource: '*'
                Condition:
                  StringEquals:
                    ecs:cluster: !GetAtt [RetoolCluster, Arn]
              # RunTask is scoped to the sandbox task family AND this stack's
              # cluster (matching the StopTask boundary) so a compromised
              # controller cannot launch the sandbox task (and its delegated S3
              # snapshot permissions) on an unrelated compatible ECS cluster.
              - Effect: Allow
                Action: [ecs:RunTask]
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/retool-agent-sandbox:*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt [RetoolCluster, Arn]
              - Effect: Allow
                Action: [iam:PassRole]
                Resource:
                  - !GetAtt [SandboxTaskRole, Arn]
                  - !GetAtt [SandboxExecutionRole, Arn]

  # SQS permissions are scoped to the watcher queue and only attached when the
  # watcher is enabled (the queue is conditionally created). See EnableWatcher.
  AgentSandboxControllerSqsPolicy:
    Condition: EnableWatcher
    Type: AWS::IAM::Policy
    Properties:
      Roles:
        - !Ref AgentSandboxControllerTaskRole
      PolicyName: agent-sandbox-controller-sqs
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
            Resource: !GetAtt [SandboxTaskEventsQueue, Arn]

  # Task execution role (image pull + log writes) shared by the R2 task defs.
  SandboxExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: /
      Policies:
        - PolicyName: agent-sandbox-execution
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource:
                  - !Ref AgentSandboxJwtPrivateKeySecret
                  - !Ref AgentSandboxJwtPublicKeySecret
                  - !Ref AgentSandboxEncryptionKeySecret

  # Sandbox task role: snapshot S3 read/write via the default credential chain.
  SandboxTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: /
      Policies:
        - PolicyName: agent-sandbox-snapshots
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !GetAtt [RrSnapshotsBucket, Arn]
                  - !Sub "${RrSnapshotsBucket.Arn}/*"

  # Shared SG for the controller + proxy task ENIs.
  AgentSandboxControllerProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'agent sandbox controller/proxy security group']]
      VpcId: !Ref 'VpcId'

  ControllerIngressFromBackend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3018
      ToPort: 3018
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  ProxyIngressFromBackend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3019
      ToPort: 3019
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  ProxyIngressFromSandboxHosts:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3019
      ToPort: 3019
      SourceSecurityGroupId: !GetAtt [SandboxInstanceSecurityGroup, GroupId]

  # Backend reachable from controller/proxy (token exchange, SANDBOX_BACKEND_URL)
  # and from sandbox containers (egress via the sandbox host SG).
  BackendIngressFromControllerProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RetoolSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]

  BackendIngressFromSandboxHosts:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RetoolSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !GetAtt [SandboxInstanceSecurityGroup, GroupId]

  # Controller (health-poll) and proxy (request forwarding) reach sandbox
  # containers on the bridge dynamic host-port range.
  SandboxHostIngressFromControllerProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [SandboxInstanceSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 60999
      SourceSecurityGroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]

  RrSnapshotsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  RrGitBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # EventBridge -> SQS task-state watcher (optional; controller polls otherwise).
  SandboxTaskEventsQueue:
    Type: AWS::SQS::Queue
    Condition: EnableWatcher
    Properties:
      MessageRetentionPeriod: 3600
      VisibilityTimeout: 60

  SandboxTaskEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: EnableWatcher
    Properties:
      Queues: [!Ref 'SandboxTaskEventsQueue']
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt [SandboxTaskEventsQueue, Arn]
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt [SandboxTaskStateRule, Arn]

  SandboxTaskStateRule:
    Type: AWS::Events::Rule
    Condition: EnableWatcher
    Properties:
      Description: ECS task-state changes for the agent sandbox group.
      EventPattern:
        source: ["aws.ecs"]
        detail-type: ["ECS Task State Change"]
        detail:
          clusterArn: [!GetAtt [RetoolCluster, Arn]]
          group: ["agent-executor-sandbox"]
      Targets:
        - Arn: !GetAtt [SandboxTaskEventsQueue, Arn]
          Id: sandbox-task-events

Outputs:
  ECSALB:
    Description: Your ALB DNS URL. The agent sandbox proxy is served same-origin under /sandbox/* through the backend, so no separate endpoint is exposed.
    Value: !GetAtt [ECSALB, DNSName]
