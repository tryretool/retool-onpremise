AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Retool + Workflows + R2 (agent sandbox) on ECS-on-EC2. Self-contained: defines
  its own ECS cluster, two EC2 capacity pools (awsvpc platform services + a
  gVisor-ready bridge-networked sandbox pool), the agent-sandbox controller/proxy,
  the pre-registered sandbox task definition the controller RunTasks, the
  js-executor and r2-agent Temporal worker, S3 snapshot/git buckets, and an
  optional EventBridge->SQS task-state watcher.
Parameters:
  Environment:
    Type: String
    Description: Environment string sent back to plogger with the logs
  SubnetId:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Select at two private subnets in your selected VPC (for ECS tasks and EC2 capacity).
  ALBSubnetId:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Select the subnets for your Application Load Balancer.
  RetoolVersion:
    Type: String
    Description: Retool version tag (e.g. 3.114.7-stable). Used for backend, code-executor, js-executor, and agent-sandbox-service images.
    Default: 3.114.7-stable
  BackendImageRepository:
    Type: String
    Description: >-
      Image repository for the Retool backend (API, jobs-runner, workflows
      backend/worker, r2-agent-worker). Tag is always RetoolVersion. Override
      to pull from a private registry, e.g. an ECR mirror.
    Default: "tryretool/backend"
  CodeExecutorImageRepository:
    Type: String
    Description: >-
      Image repository for the code executor. Tag is always RetoolVersion.
      Override to pull from a private registry, e.g. an ECR mirror.
    Default: "tryretool/code-executor-service"
  AgentSandboxImageRepository:
    Type: String
    Description: >-
      Image repository for the agent-sandbox controller, proxy, and sandbox
      task definition. Tag is always RetoolVersion. Override to pull from a
      private registry — note the internal ECR mirror publishes this image as
      agent-executor-service.
    Default: "tryretool/agent-sandbox-service"
  JsExecutorImageRepository:
    Type: String
    Description: >-
      Image repository for the js-executor. Tag is always RetoolVersion.
      Override to pull from a private registry, e.g. an ECR mirror.
    Default: "tryretool/js-executor-service"
  DesiredCount:
    Type: Number
    Description: Default number of API container tasks to run
    Default: 1
  DesiredWorkflowsCount:
    Type: Number
    Description: Default number of tasks to run for Workflows Backend and Workflows Worker containers to run
    Default: 1
  DesiredCodeExecutorCount:
    Type: Number
    Description: Default number of tasks to run for Retool Code Executor containers
    Default: 1
  EnableWorkflows:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      Deploy the Workflows backend/worker services. Requires a Temporal
      backend (TemporalBackend=self-hosted or retool-managed). When false,
      Workflows (the product) is unavailable; DesiredWorkflowsCount is inert.
  TemporalBackend:
    Type: String
    AllowedValues: ["self-hosted", "retool-managed", "none"]
    Default: "self-hosted"
    Description: >-
      self-hosted (default): deploy the internal Temporal cluster (5 services +
      dedicated Aurora Postgres) and point Workflows + R2 at it.
      retool-managed: skip the internal cluster; Workflows + R2 connect to
      Retool-managed Temporal Cloud. The WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_HOST
      env var is intentionally left unset (that is what selects the managed
      path); you must complete the one-time Temporal Cloud enrollment in the
      Retool UI (Settings -> Workflows) after first login, which stores the
      namespace + mTLS certs in the database.
      none: no Temporal anywhere; R2 orchestration runs on pg-boss against the
      main Postgres (R2_ORCHESTRATION_BACKEND=postgres). Requires
      EnableWorkflows=false.
  MaximumPercent:
    Type: Number
    Description: Maximum percentage of tasks to run during a deployment
    Default: 150
  MinimumHealthyPercent:
    Type: Number
    Default: 50
    Description: Minimum percentage of healthy tasks to keep running during a deployment
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Select a VPC that allows instances access to the Internet.
  LicenseKey:
    Type: String
    NoEcho: true
    Description: Retool license key. Without a valid key the backend will refuse to start.
    Default: "EXPIRED-LICENSE-KEY-TRIAL"
  CertificateArn:
    Type: String
    Description: >-
      Optional ACM certificate ARN. When provided, the ALB serves HTTPS on 443
      and redirects HTTP to HTTPS, and COOKIE_INSECURE is forced off. Leave blank
      for plaintext HTTP (e.g. when terminating TLS on an upstream load balancer).
    Default: ""
  AlbScheme:
    Type: String
    AllowedValues: ["internal", "internet-facing"]
    Default: "internal"
    Description: >-
      ALB scheme. Defaults to internal so the stack is not reachable from the
      internet unless an operator explicitly opts in. For a public deployment,
      set to internet-facing and supply a CertificateArn so authenticated
      traffic is served over HTTPS rather than plaintext HTTP.
  AlbIngressCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: >-
      CIDR allowed to reach the ALB on 80/443. Defaults to open. Ignored when
      AlbIngressSourceSecurityGroupId is set. NOTE for Tailscale subnet
      routers: forwarded traffic arrives with the RELAY'S VPC IP as source
      (subnet routers SNAT to their VPC interface address, not their 100.x
      tailnet IP), so allow the relay's IP/subnet — or better, pass the relay's
      security group via AlbIngressSourceSecurityGroupId.
  AlbIngressSourceSecurityGroupId:
    Type: String
    Default: ""
    Description: >-
      Optional security group ID allowed to reach the ALB on 80/443 (overrides
      AlbIngressCidr when set). For an internal ALB fronted by a Tailscale
      subnet router, pass the relay instance's security group ID — stable
      across relay IP changes, unlike a CIDR.
  Force:
    Type: String
    Description: "Used to force the deployment even when the image and parameters are otherwised unchanged."
    Default: "false"
  CloudMapNamespaceName:
    Type: String
    Default: "retoolsvc"
    AllowedPattern: "^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?$"
    Description: >-
      Cloud Map private DNS namespace used for internal service discovery
      (hostnames like <service>.retoolsvc). A private DNS namespace name is a
      VPC-wide singleton, so if the VPC already hosts another deployment using
      the default name, set this to something unique (e.g. retoolsvc-r2) — this
      stack then creates its own namespace and hosted zone, and internal
      hostnames use the new name everywhere.
  BaseDomain:
    Type: String
    Default: ""
    Description: >-
      External base URL of the deployment (e.g. https://retool.example.com),
      required by the backend as BASE_DOMAIN. When left empty it defaults to
      the stack's ALB DNS name (http, or https when a CertificateArn is set).
  RdsStorageEncrypted:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      Encrypt the main Retool Postgres instance and (when
      TemporalBackend=self-hosted) the internal Temporal Aurora cluster at
      rest. Defaults to false to match retool.yaml / retool-workflows.ec2.yaml:
      storage encryption cannot be toggled on an existing RDS resource, so a
      false default keeps in-place upgrades from those templates safe from
      accidental database replacement. Set true for fresh deployments that
      require encryption at rest (enabling it later requires a pg_dump
      migration).
  PostgresEngineVersion:
    Type: String
    Description: >-
      Engine version for the main Retool Postgres instance. AWS periodically
      removes old minor versions, so check aws rds describe-db-engine-versions
      --engine postgres if deployment fails with "Cannot find version".
    Default: "15.19"
  TemporalPostgresEngineVersion:
    Type: String
    Description: >-
      Engine version for the internal Temporal Aurora Serverless v2 cluster
      (only deployed when TemporalBackend=self-hosted). AWS periodically removes
      old minor versions, so check aws rds describe-db-engine-versions
      --engine aurora-postgresql if deployment fails with "Cannot find version".
    Default: "16.8"

  # --- EC2 capacity ---------------------------------------------------------
  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: ECS-optimized AMI. Default resolves the latest Amazon Linux 2023 ECS AMI (no AppArmor; the gVisor sandbox needs /dev/net/tun on the host — see the AMI note in cloudformation/README.md).
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id
  KeyName:
    Type: String
    Description: Optional EC2 key pair name for SSH access to capacity instances. Leave blank to disable SSH.
    Default: ""
  PlatformInstanceType:
    Type: String
    Description: Instance type for the platform capacity pool (awsvpc Retool/Workflows/Temporal services). Size for ENI count, not just CPU/RAM.
    Default: m5.xlarge
  PlatformAsgMinSize:
    Type: Number
    Default: 2
  PlatformAsgMaxSize:
    Type: Number
    Default: 6
  PlatformAsgDesiredCapacity:
    Type: Number
    Default: 3
  SandboxInstanceType:
    Type: String
    Description: Instance type for the sandbox capacity pool. Hosts the bridge-networked sandboxes (2 vCPU / 4 GB each) and the js-executor (2 vCPU / 4 GB per task), which is pinned to this pool.
    Default: m5.2xlarge
  SandboxAsgMinSize:
    Type: Number
    Default: 1
  SandboxAsgMaxSize:
    Type: Number
    Default: 10
  SandboxAsgDesiredCapacity:
    Type: Number
    Description: Provision enough instances to hold the prewarm pool + js-executor tasks (DesiredCodeExecutorCount) plus headroom (each m5.2xlarge holds ~4 tasks).
    Default: 2
  SandboxInstanceVolumeSize:
    Type: Number
    Description: Root EBS volume (GiB) for sandbox hosts. Sandbox /tmp is large (build artifacts), so give headroom.
    Default: 100

  # --- Agent sandbox (R2) secrets -------------------------------------------
  # CloudFormation cannot mint an EC P-256 keypair, so the JWT keys are passed in.
  # Generate with:
  #   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out ae.key
  #   openssl ec -in ae.key -pubout -out ae.pub
  AgentSandboxJwtPublicKey:
    Type: String
    NoEcho: true
    Description: ES256 (P-256) public key PEM for sandbox token verification. Newlines may be literal or \n-escaped.
  AgentSandboxJwtPrivateKey:
    Type: String
    NoEcho: true
    Description: ES256 (P-256) private key PEM the backend uses to mint sandbox tokens.
  AgentSandboxEncryptionKey:
    Type: String
    NoEcho: true
    Description: Hex-encoded 256-bit key (openssl rand -hex 32) for encrypting credentials in the agent sandbox state store. Must match the backend.
  AllowedDomains:
    Type: String
    Description: Optional comma-separated allowlist of external domains sandboxes may reach via the proxy (e.g. api.openai.com,api.anthropic.com). Empty allows all non-blocked egress.
    Default: ""

  # --- Watcher --------------------------------------------------------------
  EnableTaskEventWatcher:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Create an EventBridge->SQS pipeline for ECS task-state changes so the controller reconciles faster. When false, the controller falls back to its 5s reconcile poll.

Rules:
  RequireTlsForPublicAlb:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref AlbScheme, "internet-facing"]]
          - !Not [!Equals [!Ref CertificateArn, ""]]
        AssertDescription: >-
          AlbScheme=internet-facing exposes the stack to the internet and must
          be paired with a CertificateArn so authenticated traffic is served over
          HTTPS. Use an internal ALB (the default) or supply an ACM certificate.
  WorkflowsRequiresTemporal:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref EnableWorkflows, "false"]
          - !Not [!Equals [!Ref TemporalBackend, "none"]]
        AssertDescription: >-
          EnableWorkflows=true requires a Temporal backend. Set
          TemporalBackend to self-hosted (in-cluster Temporal) or
          retool-managed (Temporal Cloud), or set EnableWorkflows=false to
          deploy the minimal R2 stack on pg-boss.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  HasAllowedDomains: !Not [!Equals [!Ref AllowedDomains, ""]]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  EnableWatcher: !Equals [!Ref EnableTaskEventWatcher, "true"]
  WorkflowsEnabled: !Equals [!Ref EnableWorkflows, "true"]
  TemporalSelfHosted: !Equals [!Ref TemporalBackend, "self-hosted"]
  TemporalDisabled: !Equals [!Ref TemporalBackend, "none"]
  HasBaseDomain: !Not [!Equals [!Ref BaseDomain, ""]]
  HasAlbIngressSg: !Not [!Equals [!Ref AlbIngressSourceSecurityGroupId, ""]]
  RdsEncrypted: !Equals [!Ref RdsStorageEncrypted, "true"]

Resources:
  # ===========================================================================
  # ECS cluster + EC2 capacity
  #
  # Two capacity pools share the cluster:
  #   - Platform: awsvpc services (Retool, Workflows, Temporal, code-executor,
  #     agent-sandbox controller/proxy, r2-agent-worker). Each task gets an ENI,
  #     so instances are sized for ENI count.
  #   - Sandbox: gVisor-ready hosts for the bridge-networked, RunTask'd ephemeral
  #     sandboxes plus the js-executor (pinned here for nsjail's seccomp needs).
  #     UserData loads /dev/net/tun and installs a relaxed Docker daemon-default
  #     seccomp profile (ECS task definitions cannot set per-task profiles).
  #     Tagged with the `retool.sandbox` ECS attribute so only sandbox-pool
  #     tasks land here.
  # Capacity-provider binding keeps platform services off sandbox hosts; the
  # sandbox task definition's memberOf placement constraint keeps sandboxes on
  # sandbox hosts.
  # ===========================================================================
  RetoolCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref 'AWS::StackName'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: [ec2.amazonaws.com]
            Action: ['sts:AssumeRole']
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles: [!Ref EcsInstanceRole]

  PlatformInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'platform capacity instance security group']]
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (ECR/ECS/logs/RDS)

  SandboxInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'sandbox capacity instance security group']]
      VpcId: !Ref 'VpcId'
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (S3 snapshots, sandbox egress via proxy, backend callbacks)

  PlatformLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Join ['-', [!Ref 'AWS::StackName', 'platform']]
      LaunchTemplateData:
        ImageId: !Ref 'EcsAmiId'
        InstanceType: !Ref 'PlatformInstanceType'
        KeyName: !If [HasKeyName, !Ref 'KeyName', !Ref 'AWS::NoValue']
        IamInstanceProfile:
          Arn: !GetAtt [EcsInstanceProfile, Arn]
        SecurityGroupIds:
          - !GetAtt [PlatformInstanceSecurityGroup, GroupId]
        # js-executor runs on the sandbox pool (it needs those hosts' relaxed
        # Docker seccomp default for nsjail), so platform hosts keep Docker's
        # stock seccomp profile.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            echo "ECS_CLUSTER=${RetoolCluster}" >> /etc/ecs/ecs.config

  SandboxLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Join ['-', [!Ref 'AWS::StackName', 'sandbox']]
      LaunchTemplateData:
        ImageId: !Ref 'EcsAmiId'
        InstanceType: !Ref 'SandboxInstanceType'
        KeyName: !If [HasKeyName, !Ref 'KeyName', !Ref 'AWS::NoValue']
        IamInstanceProfile:
          Arn: !GetAtt [EcsInstanceProfile, Arn]
        SecurityGroupIds:
          - !GetAtt [SandboxInstanceSecurityGroup, GroupId]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref 'SandboxInstanceVolumeSize'
              VolumeType: gp3
              DeleteOnTermination: true
        # gVisor (runsc --rootless) + pasta run inside the sandbox container and
        # need /dev/net/tun on the host plus a seccomp profile that allows their
        # mount/pivot_root/unshare syscalls. ECS task definitions cannot set
        # custom seccomp profiles (DockerSecurityOptions rejects them), so the
        # profile is installed as the Docker DAEMON DEFAULT here instead: every
        # container on a sandbox host (sandbox tasks + the js-executor, which is
        # pinned to this pool) inherits it. Only sandbox-pool tasks can land on
        # these hosts, so the relaxed default's blast radius is exactly the
        # containers that need it. This also keeps the sandbox task definition
        # fully hardened: non-root, all capabilities dropped, no-new-privileges,
        # still seccomp-filtered (device cgroup and masked paths stay enforced).
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            echo "ECS_CLUSTER=${RetoolCluster}" >> /etc/ecs/ecs.config
            echo 'ECS_INSTANCE_ATTRIBUTES={"retool.sandbox":"true"}' >> /etc/ecs/ecs.config
            modprobe tun
            echo tun > /etc/modules-load.d/retool-tun.conf
            mkdir -p /etc/docker
            echo "" | base64 -d | gunzip > /etc/docker/seccomp.json
            chmod 0644 /etc/docker/seccomp.json
            # Point the Docker daemon at the custom default seccomp profile
            # (merging into daemon.json in case the AMI ships one). Restarting
            # docker here at boot is safe: the ECS agent registers this instance
            # only after docker is up, and no tasks have been placed yet.
            python3 -c "import json,os;p='/etc/docker/daemon.json';d=json.load(open(p)) if os.path.exists(p) else {};d['seccomp-profile']='/etc/docker/seccomp.json';json.dump(d,open(p,'w'))"
            systemctl restart docker

  PlatformAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref 'SubnetId'
      LaunchTemplate:
        LaunchTemplateId: !Ref 'PlatformLaunchTemplate'
        Version: !GetAtt [PlatformLaunchTemplate, LatestVersionNumber]
      MinSize: !Ref 'PlatformAsgMinSize'
      MaxSize: !Ref 'PlatformAsgMaxSize'
      DesiredCapacity: !Ref 'PlatformAsgDesiredCapacity'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref 'AWS::StackName', 'platform']]
          PropagateAtLaunch: true

  SandboxAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref 'SubnetId'
      LaunchTemplate:
        LaunchTemplateId: !Ref 'SandboxLaunchTemplate'
        Version: !GetAtt [SandboxLaunchTemplate, LatestVersionNumber]
      MinSize: !Ref 'SandboxAsgMinSize'
      MaxSize: !Ref 'SandboxAsgMaxSize'
      DesiredCapacity: !Ref 'SandboxAsgDesiredCapacity'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref 'AWS::StackName', 'sandbox']]
          PropagateAtLaunch: true

  PlatformCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref 'PlatformAutoScalingGroup'
        # ManagedTerminationProtection requires the ASG to enable scale-in
        # protection, which blocks stack deletion (the ASG can never drain:
        # "all remaining instances are protected from scale-in"). Keep both
        # off so teardown works. The tradeoff: a managed-scaling scale-in event
        # may terminate instances with running tasks — services reschedule
        # automatically; re-enable both together only if you accept manual
        # unprotection before every delete-stack.
        ManagedTerminationProtection: DISABLED
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100

  # Managed scaling reacts to tasks placed via this capacity provider's strategy.
  # The controller currently RunTasks with launchType EC2, so for v1 size the
  # sandbox ASG statically (DesiredCapacity for the prewarm pool + headroom).
  SandboxCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref 'SandboxAutoScalingGroup'
        ManagedTerminationProtection: DISABLED
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 90

  ClusterCapacityProviderAssociations:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref 'RetoolCluster'
      CapacityProviders:
        - !Ref 'PlatformCapacityProvider'
        - !Ref 'SandboxCapacityProvider'
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref 'PlatformCapacityProvider'
          Weight: 1
          Base: 0

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'load balancer security group']]
      VpcId: !Ref 'VpcId'

  GlobalHttpInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [ALBSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '80'
      ToPort: '80'
      # SG-source (Tailscale relay) takes precedence over the CIDR when set.
      CidrIp: !If [HasAlbIngressSg, !Ref 'AWS::NoValue', !Ref AlbIngressCidr]
      SourceSecurityGroupId: !If [HasAlbIngressSg, !Ref AlbIngressSourceSecurityGroupId, !Ref 'AWS::NoValue']

  GlobalHttpsInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [ALBSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '443'
      ToPort: '443'
      CidrIp: !If [HasAlbIngressSg, !Ref 'AWS::NoValue', !Ref AlbIngressCidr]
      SourceSecurityGroupId: !If [HasAlbIngressSg, !Ref AlbIngressSourceSecurityGroupId, !Ref 'AWS::NoValue']
  
  RetoolSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'retool container security group']]
      VpcId: !Ref 'VpcId'

  ALBInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RetoolSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '3000'
      ToPort: '3000'
      SourceSecurityGroupId: !GetAtt [ALBSecurityGroup, GroupId]

  RetoolSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RetoolSecurityGroup, GroupId]
      IpProtocol: -1
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  TemporalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: TemporalSelfHosted
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'temporal security group']]
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      VpcId: !Ref 'VpcId'

  TemporalFrontendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: TemporalSelfHosted
    Properties:
      GroupId: !GetAtt [TemporalSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 7233
      ToPort: 7233
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  TemporalSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: TemporalSelfHosted
    Properties:
      GroupId: !GetAtt [TemporalSecurityGroup, GroupId]
      IpProtocol: -1
      SourceSecurityGroupId: !GetAtt [TemporalSecurityGroup, GroupId]


  CloudwatchLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['-', [ECSLogGroup, !Ref 'AWS::StackName']]
      RetentionInDays: 14

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'database security group']]
      VpcId: !Ref 'VpcId'

  # Dedicated security group for the Temporal Aurora cluster. Kept separate from
  # RDSSecurityGroup (the Retool main database) so ingress rules on one database
  # do not implicitly open the other. Temporal containers must only be able to
  # reach the Temporal database, not the Retool production database.
  TemporalRDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: TemporalSelfHosted
    Properties:
      GroupDescription: !Join [" ", [!Ref 'AWS::StackName', 'temporal database security group']]
      VpcId: !Ref 'VpcId'

  RetoolECSPostgresInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RDSSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '5432'
      ToPort: '5432'
      SourceSecurityGroupId: !GetAtt [RetoolSecurityGroup, GroupId]

  # The agent-sandbox controller and proxy are PostgreSQL-backed and run under
  # their own security group, so they need their own ingress to the database.
  AgentSandboxPostgresInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt [RDSSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '5432'
      ToPort: '5432'
      SourceSecurityGroupId: !GetAtt [AgentSandboxControllerProxySecurityGroup, GroupId]

  # The Temporal services (frontend, history, matching, worker, web) run under
  # their own security group and connect to the Temporal Aurora cluster, which
  # uses TemporalRDSSecurityGroup (separate from the Retool database). This
  # grants Temporal containers access only to the Temporal database.
  TemporalPostgresInbound:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: TemporalSelfHosted
    Properties:
      GroupId: !GetAtt [TemporalRDSSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: '5432'
      ToPort: '5432'
      SourceSecurityGroupId: !GetAtt [TemporalSecurityGroup, GroupId]

  RetoolTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool'
      TaskRoleArn: !Ref 'RetoolTaskRole'
      ExecutionRoleArn: !Ref 'RetoolExecutionRole'
      NetworkMode: awsvpc
      ContainerDefinitions:
      - Name: 'retool'
        Cpu: '2048'
        Memory: '6144'
        Essential: 'true'
        Image: !Sub '${BackendImageRepository}:${RetoolVersion}'
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref 'CloudwatchLogsGroup'
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: "SERVICE_RETOOL"
        Environment:
          - Name: DEPLOYMENT_TEMPLATE_TYPE
            Value: "aws-ecs-ec2"
          - Name: NODE_ENV
            Value: production
          - Name: SERVICE_TYPE
            Value: MAIN_BACKEND,DB_CONNECTOR,DB_SSH_CONNECTOR,RR_GIT_SERVER
          - Name: "FORCE_DEPLOYMENT"
            Value: !Ref "Force"
          - Name: POSTGRES_DB
            Value: hammerhead_production
          - Name: POSTGRES_HOST
            Value: !GetAtt [RetoolRDSInstance, Endpoint.Address]
          - Name: POSTGRES_SSL_ENABLED
            Value: "true"
          - Name: POSTGRES_PORT
            Value: "5432"
          - Name: POSTGRES_USER
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:username}}' ]]
          - Name: POSTGRES_PASSWORD
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolRDSSecret, ':SecretString:password}}' ]]
          - Name: JWT_SECRET
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolJWTSecret, ':SecretString:password}}' ]]
          - Name: ENCRYPTION_KEY
            Value: !Join ['', ['{{resolve:secretsmanager:', !Ref RetoolEncryptionKeySecret, ':SecretString:password}}' ]]
          # In-cluster Temporal wiring only exists when TemporalBackend=self-hosted.
          # When unset (retool-managed / none) the backend does NOT fall back to
          # localhost — it selects the Retool-managed Temporal Cloud path (or
          # pg-boss for R2 when TemporalBackend=none).
          - Fn::If:
              - TemporalSelfHosted
              - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_HOST
                Value: !Sub 'temporal.${CloudMapNamespaceName}'
              - !Ref 'AWS::NoValue'
          - Fn::If:
              - TemporalSelfHosted
              - Name: WORKFLOW_TEMPORAL_CLUSTER_FRONTEND_PORT
                Value: "7233"
              - !Ref 'AWS::NoValue'
          - Fn::If:
              - WorkflowsEnabled
              - Name: WORKFLOW_BACKEND_HOST
                Value: !Sub 'http://workflows-backend.${CloudMapNamespaceName}:3000'
              - !Ref 'AWS::NoValue'
          # pg-boss orchestration for R2 when no Temporal backend is deployed.
          - Fn::If:
              - TemporalDisabled
              - Name: R2_ORCHESTRATION_BACKEND
                Value: postgres
              - !Ref 'AWS::NoValue'
          - Name: CODE_EXECUTOR_INGRESS_DOMAIN
            Value: !Sub 'http://code-executor.${CloudMapNamespaceName}:3004'
          - Name: JS_EXECUTOR_INGRESS_DOMAIN
            Value: !Sub 'http://js-executor.${CloudMapNamespaceName}:3000'
          - Name: BASE_DOMAIN
            Value: !If [HasBaseDomain, !Ref BaseDomain, !If [HasCertificate, !Sub 'https://${ECSALB.DNSName}', !Sub 'http://${ECSALB.DNSName}']]
          - Name: LICENSE_KEY
            Value: !Ref LicenseKey
          # Set automatically from CertificateArn: insecure cookies are only
          # served when no TLS certificate is attached to the ALB.
          - Name: COOKIE_INSECURE
            Value: !If [HasCertificate, "false", "true"]
          # --- R2 / agent sandbox integration ---
          - Name: AGENT_SANDBOX_ENABLED
            Value: "true"
          - Name: RR_AGENT_PUBSUB_BACKEND
            Value: postgres
          - Name: AGENT_SANDBOX_CONTROLLER_INGRESS_DOMAIN
            Value: !Sub 'http://agent-sandbox-controller.${CloudMapNamespaceName}:3018'
          # Browser sandbox traffic is served same-origin: the frontend hits the
          # main ingress and the backend forwards /sandbox/* to the proxy below.
          # AGENT_SANDBOX_FRONTEND_WS_PROXY_DOMAIN is intentionally unset so the
          # backend falls back to the org's base URL.
          - Name: AGENT_SANDBOX_PROXY_INGRESS_DOMAIN
            Value: !Sub 'http://agent-sandbox-proxy.${CloudMapNamespaceName}:3019'
          # no-verify (not require): node-postgres maps sslmode=require to
          # verification-on, which fails on RDS's self-signed CA. no-verify
          # keeps the connection encrypted without cert verification. Once
          # the agent-executor image ships the RDS CA bundle, switch to
          # sslmode=verify-full and set NODE_EXTRA_CA_CERTS=<bundle path> on
          # the controller/proxy/r2-agent-worker tasks.
          - Name: AGENT_SANDBOX_POSTGRES_URL
            Value: !Sub
              - "postgres://${U}:${P}@${H}:5432/hammerhead_production?sslmode=no-verify"
              - U: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:username}}'
                P: !Sub '{{resolve:secretsmanager:${RetoolRDSSecret}:SecretString:password}}'
                H: !GetAtt [RetoolRDSInstance, Endpoint.Address]
          - Name: AGENT_SANDBOX_POSTGRES_SCHEMA
            Value: agent_executor
          # --- R2 blob storage (snapshots + RR git) ---
          - Name: RR_SNAPSHOTS_S3_BUCKET
            Value: !Ref 'RrSnapshotsBucket'
          - Name: RR_SNAPSHOTS_S3_REGION
            Value: !Ref 'AWS::Region'
          - Name: RR_GIT_S3_BUCKET
            Value: !Ref 'RrGitBucket'
          - Name: RR_GIT_S3_REGION
            Value: !Ref 'AWS::Region'
        Secrets:
          - Name: AGENT_SANDBOX_JWT_PRIVATE_KEY
            ValueFrom: !Ref AgentSandboxJwtPrivateKeySecret
          - Name: AGENT_SANDBOX_JWT_PUBLIC_KEY
            ValueFrom: !Ref AgentSandboxJwtPublicKeySecret
          - Name: AGENT_SANDBOX_ENCRYPTION_KEY
            ValueFrom: !Ref AgentSandboxEncryptionKeySecret
        PortMappings:
        - ContainerPort: '3000'
          # HostPort: '80'
        Command: ["./docker_scripts/start_api.sh"]

  RetoolJobsRunnerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: 'retool-jobs-runner'
      TaskRoleArn: !Ref 'RetoolTaskRole'
